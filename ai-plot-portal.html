<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Plot Portal • Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    #map { height: 100%; width: 100%; border-radius: 1.5rem; }
    .modal { animation: fadeInScale 0.2s ease-out; }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    
    /* Performance Optimizations */
    .loading-spinner {
      border: 3px solid #374151;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .sidebar-mobile { 
        position: fixed; 
        z-index: 100; 
        transform: translateX(-100%); 
        transition: transform 0.3s ease;
      }
      .sidebar-mobile.open { transform: translateX(0); }
      
      .main-content-mobile { margin-left: 0 !important; }
      
      .map-container-mobile { height: calc(100vh - 180px) !important; }
      
      .card-mobile { width: 100% !important; margin: 0; }
      
      .table-mobile { font-size: 12px; }
      .table-mobile th, .table-mobile td { padding: 8px 4px; }
      
      .modal-mobile { width: 95% !important; max-height: 90vh; }
      
      .btn-mobile { padding: 12px 16px !important; font-size: 14px; }
    }
    
    .hamburger { display: none; }
    @media (max-width: 768px) { .hamburger { display: block; } }
  </style>
</head>
<body class="bg-gray-950 text-gray-100">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div id="sidebar" class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col sidebar-mobile md:transform-none md:relative">
      <div class="p-6 border-b border-gray-800 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center">
            <i class="fas fa-map-marked text-white text-xl"></i>
          </div>
          <div>
            <h1 class="text-2xl font-bold">AI Plot</h1>
            <p class="text-xs text-gray-500 -mt-1">Pro Edition</p>
          </div>
        </div>
        <button onclick="toggleSidebar()" class="md:hidden text-2xl">×</button>
      </div>
      <nav class="flex-1 p-4 space-y-1">
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-blue-600 text-white">
          <i class="fas fa-map-marker-alt"></i> Plots
        </a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
      <div class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-4 md:px-8">
        <div class="flex items-center gap-4">
          <button onclick="toggleSidebar()" class="hamburger md:hidden text-2xl px-3">☰</button>
          <h2 class="text-xl md:text-2xl font-semibold">Plot Management</h2>
          <div class="px-3 py-1 bg-gray-800 rounded-full text-xs text-gray-400 hidden md:block">1,284 Plots</div>
        </div>
        <div class="flex items-center gap-4">
          <button onclick="importPlots()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-file-import"></i> Import
          </button>
          <button onclick="exportCSV()" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-download"></i> Export
          </button>
          <button onclick="startDistanceCalculator()" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-ruler"></i> Measure Distance
          </button>
          <button onclick="addNewPlot()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-plus"></i> New Plot
          </button>
          <button onclick="connectGoogleCalendar()" class="px-5 py-2.5 bg-white text-black hover:bg-gray-200 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fab fa-google"></i> Connect Calendar
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-auto p-8">
        <div class="flex justify-between items-center mb-6">
          <div class="flex gap-3">
            <button onclick="togglePlotView('map')" id="mapTab" class="px-6 py-2.5 bg-blue-600 rounded-2xl text-sm font-medium flex items-center gap-2">
              <i class="fas fa-map"></i> Map View
            </button>
            <button onclick="togglePlotView('table')" id="tableTab" class="px-6 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-2xl text-sm font-medium flex items-center gap-2">
              <i class="fas fa-table"></i> Table View
            </button>
          </div>

          <div class="flex items-center gap-4">
            <select id="statusFilter" onchange="applyFilters()" class="bg-gray-800 px-5 py-3 rounded-2xl text-sm">
              <option value="">All Status</option>
              <option value="Available">Available</option>
              <option value="Reserved">Reserved</option>
              <option value="Sold">Sold</option>
            </select>
            <button onclick="clearFilters()" class="px-5 py-3 bg-gray-800 hover:bg-gray-700 rounded-2xl text-sm">Clear</button>
            <div class="relative w-80">
              <input type="text" id="mapSearch" placeholder="Search plots..." class="w-full bg-gray-800 px-5 py-3 pl-12 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" oninput="debounceSearch()">
              <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
            </div>
          </div>
        </div>

        <!-- Legend -->
        <div class="legend absolute top-24 right-8 z-[1000] px-5 py-4 rounded-3xl border border-gray-700 shadow-2xl text-sm">
          <div class="flex items-center gap-2 mb-3">
            <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
            <span class="font-semibold text-xs tracking-wider">STATUS</span>
          </div>
          <div class="space-y-2 text-sm">
            <div class="flex items-center gap-3"><div class="w-3 h-3 bg-green-500 rounded-full"></div> Available</div>
            <div class="flex items-center gap-3"><div class="w-3 h-3 bg-orange-500 rounded-full"></div> Reserved</div>
            <div class="flex items-center gap-3"><div class="w-3 h-3 bg-red-500 rounded-full"></div> Sold</div>
          </div>
        </div>

        <div id="mapView" class="flex gap-6 h-[calc(100vh-200px)]">
          <div class="flex-1 bg-gray-900 rounded-3xl overflow-hidden relative border border-gray-800">
            <div id="map"></div>
            <div id="mapLoading" class="absolute inset-0 flex items-center justify-center bg-gray-900/80 z-[999]">
              <div class="text-center">
                <div class="loading-spinner mx-auto mb-3"></div>
                <div class="text-sm text-gray-400">Loading Map...</div>
              </div>
            </div>
            
            <!-- Geocoding Search Bar -->
            <div class="absolute top-5 left-5 z-[1000] w-80">
              <div class="bg-gray-900/95 backdrop-blur-xl border border-gray-700 rounded-2xl p-2 shadow-xl flex items-center">
                <input type="text" id="geocodeSearch" placeholder="Search address or landmark..." 
                  class="flex-1 bg-transparent px-4 py-2 text-sm focus:outline-none" 
                  onkeypress="if (event.key === 'Enter') geocodeAddress()">
                <button onclick="geocodeAddress()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-xl text-sm font-medium flex items-center gap-2">
                  <i class="fas fa-search"></i> Search
                </button>
              </div>
            </div>
            
            <!-- Map Style Switcher -->
            <div class="absolute top-20 right-5 z-[1000]">
              <div class="bg-gray-900/95 backdrop-blur-xl border border-gray-700 rounded-2xl p-1 shadow-xl text-sm">
                <button onclick="setMapStyle('streets-v12')" class="w-full px-4 py-2 text-left rounded-xl flex items-center gap-3 hover:bg-gray-700">
                  <i class="fas fa-road w-4"></i> Streets
                </button>
                <button onclick="setMapStyle('satellite-streets-v12')" class="w-full px-4 py-2 text-left rounded-xl flex items-center gap-3 hover:bg-gray-700">
                  <i class="fas fa-satellite w-4"></i> Satellite
                </button>
                <button onclick="setMapStyle('outdoors-v12')" class="w-full px-4 py-2 text-left rounded-xl flex items-center gap-3 hover:bg-gray-700">
                  <i class="fas fa-mountain w-4"></i> Outdoors
                </button>
                <button onclick="setMapStyle('light-v11')" class="w-full px-4 py-2 text-left rounded-xl flex items-center gap-3 hover:bg-gray-700">
                  <i class="fas fa-sun w-4"></i> Light
                </button>
              </div>
            </div>
          </div>

          <div id="mapCard" class="w-96 bg-gray-900 rounded-3xl p-7 overflow-auto hidden border border-gray-700"></div>
        </div>

        <div id="plotTableView" class="hidden mt-6">
          <div class="flex justify-between items-center mb-4">
            <div class="flex gap-3">
              <button onclick="bulkDelete()" class="px-6 py-2.5 bg-red-600 hover:bg-red-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
                <i class="fas fa-trash"></i> Delete Selected
              </button>
              <button onclick="bulkExport()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
                <i class="fas fa-download"></i> Export Selected
              </button>
            </div>
            <span class="text-sm text-gray-400" id="selectedCount">0 selected</span>
          </div>
          <table class="w-full text-sm table-mobile">
            <thead class="border-b border-gray-700">
              <tr>
                <th class="w-12"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
                <th class="text-left py-4">Plot No</th>
                <th class="text-left py-4">Development</th>
                <th class="text-left py-4">Size</th>
                <th class="text-left py-4">Price</th>
                <th class="text-left py-4">Status</th>
                <th class="text-left py-4">Actions</th>
              </tr>
            </thead>
            <tbody id="plotTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Import Modal -->
  <div id="importModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-[2000]">
    <div class="modal bg-gray-900 rounded-3xl w-[620px] border border-gray-700 shadow-2xl overflow-hidden modal-mobile">
      <div class="px-8 py-6 border-b border-gray-700 flex justify-between items-center">
        <div>
          <h3 class="text-2xl font-semibold">Import Plots</h3>
          <p class="text-sm text-gray-400">Upload CSV, Excel, or JSON files</p>
        </div>
        <button onclick="closeImportModal()" class="text-3xl text-gray-400 hover:text-white">×</button>
      </div>
      
      <div class="p-8">
        <div class="border-2 border-dashed border-gray-700 rounded-2xl p-8 text-center mb-6 hover:border-blue-500 transition-colors">
          <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-4"></i>
          <p class="font-medium mb-1">Drop your file here</p>
          <p class="text-sm text-gray-400 mb-4">or</p>
          <label class="inline-block px-8 py-3 bg-blue-600 hover:bg-blue-700 rounded-2xl text-sm font-medium cursor-pointer">
            Choose File
            <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.json,.txt" class="hidden" onchange="handleFileSelect(event)">
          </label>
          <p class="text-xs text-gray-500 mt-4">Supported: CSV, Excel, JSON, TXT</p>
        </div>
      </div>

      <div class="px-8 py-5 border-t border-gray-700 flex justify-end gap-3 bg-gray-950">
        <button onclick="closeImportModal()" class="px-8 py-3 rounded-2xl border border-gray-600 hover:bg-gray-800 text-sm font-medium">Cancel</button>
        <button onclick="confirmImport()" class="px-10 py-3 bg-blue-600 hover:bg-blue-700 rounded-2xl text-sm font-medium">Import Plots</button>
      </div>
    </div>
  </div>

  <script>
    let map;
    let plots = [
      { id: 0, no: "A-128", lat: 25.2769, lng: 55.2962, dev: "Dubai Hills Estate", size: "1250", price: "4375000", status: "Available" },
      { id: 1, no: "B-305", lat: 25.2482, lng: 55.3123, dev: "Emirates Hills", size: "980", price: "6200000", status: "Reserved" },
      { id: 2, no: "C-042", lat: 25.2891, lng: 55.3784, dev: "Arabian Ranches", size: "2100", price: "8900000", status: "Sold" }
    ];
    let importedData = [], headers = [];
    let selectedPlots = new Set();
    let currentVideos = [];

    // ==================== MAPBOX ====================
    function initMap() {
      mapboxgl.accessToken = 'pk.eyJ1IjoiZGVtby1tYXBib3giLCJhIjoiY2x0c2V0dXJqMDF0azJqbzJ2d2J6a2J6ZSJ9.YourDemoTokenHere';
      
      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12',
        center: [55.2962, 25.2769],
        zoom: 11,
        pitch: 45,
        bearing: -17
      });

      map.on('load', () => {
        // Hide loading spinner
        const loadingEl = document.getElementById('mapLoading');
        if (loadingEl) loadingEl.style.display = 'none';
        
        map.addLayer({
          'id': '3d-buildings',
          'source': 'composite',
          'source-layer': 'building',
          'filter': ['==', 'extrude', 'true'],
          'type': 'fill-extrusion',
          'minzoom': 15,
          'paint': {
            'fill-extrusion-color': '#1f2937',
            'fill-extrusion-height': ['get', 'height'],
            'fill-extrusion-base': ['get', 'min_height'],
            'fill-extrusion-opacity': 0.8
          }
        });
        addPlotMarkers();
      });

      map.addControl(new mapboxgl.NavigationControl());
      map.addControl(new mapboxgl.FullscreenControl());
    }

    function addPlotMarkers() {
      plots.forEach(plot => {
        const el = document.createElement('div');
        el.style.cssText = `width:32px;height:32px;border-radius:50%;border:3px solid white;box-shadow:0 0 12px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:11px;background:${
          plot.status === 'Available' ? '#22c55e' : plot.status === 'Reserved' ? '#f59e0b' : '#ef4444'
        }`;
        el.innerHTML = plot.no;

        new mapboxgl.Marker(el)
          .setLngLat([plot.lng, plot.lat])
          .addTo(map)
          .getElement().addEventListener('click', () => selectPlot(plot.id));
      });
    }

    function setMapStyle(style) {
      map.setStyle(`mapbox://styles/mapbox/${style}`);
      map.once('style.load', () => addPlotMarkers());
    }

    // ==================== GEOCODING ====================
    function geocodeAddress() {
      const query = document.getElementById('geocodeSearch').value.trim();
      if (!query) return alert('Please enter an address');

      const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${mapboxgl.accessToken}&limit=1`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.features && data.features.length > 0) {
            const feature = data.features[0];
            const [lng, lat] = feature.center;

            map.flyTo({
              center: [lng, lat],
              zoom: 16,
              pitch: 50,
              duration: 2000
            });

            const el = document.createElement('div');
            el.style.cssText = 'width:36px;height:36px;border-radius:50%;background:#3b82f6;border:3px solid white;box-shadow:0 0 20px rgba(59,130,246,0.6);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;';
            el.innerHTML = '<i class="fas fa-map-marker-alt"></i>';

            const marker = new mapboxgl.Marker(el)
              .setLngLat([lng, lat])
              .addTo(map);

            const popup = new mapboxgl.Popup({ offset: 25 })
              .setHTML(`
                <div class="text-sm">
                  <div class="font-bold mb-1">${feature.place_name}</div>
                  <button onclick="createPlotFromGeocode(${lat}, ${lng}, '${feature.place_name.replace(/'/g, "\\'")}');" 
                    class="mt-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-xl text-white text-xs w-full">
                    Create Plot Here
                  </button>
                </div>
              `)
              .addTo(map);

            marker.setPopup(popup);
            popup.on('close', () => marker.remove());

          } else {
            alert('No results found for that address');
          }
        })
        .catch(err => {
          alert('Geocoding failed. Please check your internet connection.');
          console.error(err);
        });
    }

    function createPlotFromGeocode(lat, lng, address) {
      const plotName = prompt('Enter Plot Number (e.g., D-999):', `D-${Date.now().toString().slice(-4)}`);
      if (!plotName) return;

      const newPlot = {
        id: plots.length,
        no: plotName,
        lat: lat,
        lng: lng,
        dev: address.split(',')[0] || "New Location",
        size: "1000",
        price: "4500000",
        status: "Available"
      };

      plots.push(newPlot);
      addPlotMarkers();
      populateTable();

      alert(`✅ New plot ${plotName} created at the searched location!`);
    }

    // ==================== FILTERS & TABLE ====================
    function applyFilters() {
      const status = document.getElementById('statusFilter').value;
      const query = document.getElementById('mapSearch').value.toLowerCase().trim();
      populateTable(plots.filter(p => 
        (!status || p.status === status) &&
        (!query || p.no.toLowerCase().includes(query) || p.dev.toLowerCase().includes(query))
      ));
    }

    function clearFilters() {
      document.getElementById('statusFilter').value = '';
      document.getElementById('mapSearch').value = '';
      populateTable(plots);
    }

    // Debounced search for better performance
    let searchTimeout;
    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        applyFilters();
      }, 300);
    }

    function togglePlotView(view) {
      document.getElementById('mapView').classList.toggle('hidden', view !== 'map');
      document.getElementById('plotTableView').classList.toggle('hidden', view !== 'table');
      document.getElementById('mapTab').classList.toggle('bg-blue-600', view === 'map');
      document.getElementById('tableTab').classList.toggle('bg-blue-600', view === 'table');
    }

    function populateTable(data = plots) {
      const tbody = document.getElementById('plotTableBody');
      tbody.innerHTML = data.map(plot => `
        <tr class="hover:bg-gray-800">
          <td><input type="checkbox" onchange="toggleSelection(${plot.id}, this)" ${selectedPlots.has(plot.id) ? 'checked' : ''}></td>
          <td>${plot.no}</td>
          <td>${plot.dev}</td>
          <td>${plot.size}</td>
          <td>AED ${Number(plot.price).toLocaleString()}</td>
          <td><span class="px-4 py-1 rounded-full text-xs ${plot.status === 'Available' ? 'bg-green-500' : plot.status === 'Reserved' ? 'bg-orange-500' : 'bg-red-500'}">${plot.status}</span></td>
          <td>
            <button onclick="selectPlot(${plot.id}); togglePlotView('map')" class="text-blue-400 mr-2">View</button>
            <button onclick="deletePlot(${plot.id})" class="text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    function toggleSelection(id, checkbox) {
      if (checkbox.checked) selectedPlots.add(id);
      else selectedPlots.delete(id);
      document.getElementById('selectedCount').textContent = `${selectedPlots.size} selected`;
    }

    function toggleSelectAll() {
      const checked = document.getElementById('selectAll').checked;
      selectedPlots.clear();
      document.querySelectorAll('#plotTableBody input[type="checkbox"]').forEach(cb => {
        cb.checked = checked;
        const plotNo = cb.closest('tr').cells[1].textContent;
        const plot = plots.find(p => p.no === plotNo);
        if (plot && checked) selectedPlots.add(plot.id);
      });
      document.getElementById('selectedCount').textContent = `${selectedPlots.size} selected`;
    }

    function bulkDelete() {
      if (selectedPlots.size === 0) return alert('No plots selected');
      if (!confirm(`Delete ${selectedPlots.size} plots?`)) return;
      plots = plots.filter(p => !selectedPlots.has(p.id));
      selectedPlots.clear();
      document.getElementById('selectAll').checked = false;
      document.getElementById('selectedCount').textContent = '0 selected';
      populateTable();
    }

    function bulkExport() {
      if (selectedPlots.size === 0) return alert('No plots selected');
      const selectedData = plots.filter(p => selectedPlots.has(p.id));
      let csv = "Plot No,Development,Size,Price,Status\n";
      selectedData.forEach(p => csv += `${p.no},${p.dev},${p.size},${p.price},${p.status}\n`);
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `plots_export_${selectedData.length}_items.csv`;
      a.click();
    }

    function selectPlot(id) {
      const plot = plots.find(p => p.id === id);
      const card = document.getElementById('mapCard');
      card.classList.remove('hidden');
      
      let imageHTML = '';
      if (plot.image) {
        imageHTML = `
          <div class="mt-6">
            <div class="text-xs text-gray-400 mb-2">PLOT PHOTO</div>
            <img src="${plot.image}" class="w-full h-48 object-cover rounded-2xl border border-gray-700">
          </div>
        `;
      }
      
      let videoHTML = '';
      if (plot.videos && plot.videos.length > 0) {
        videoHTML = `<div class="mt-6"><div class="text-xs text-gray-400 mb-2">VIRTUAL TOURS & VIDEOS (${plot.videos.length})</div>`;
        
        plot.videos.forEach((video, index) => {
          if (video.type === 'file') {
            videoHTML += `
              <div class="mb-4">
                <div class="text-xs text-gray-500 mb-1">${video.name}</div>
                <video controls class="w-full rounded-2xl border border-gray-700">
                  <source src="${video.data}" type="video/mp4">
                </video>
              </div>
            `;
          } else if (video.type === 'youtube' || video.type === 'vimeo') {
            videoHTML += `
              <div class="mb-4">
                <div class="text-xs text-gray-500 mb-1">${video.title}</div>
                <div class="aspect-video rounded-2xl overflow-hidden border border-gray-700">
                  <iframe src="${video.url}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                </div>
              </div>
            `;
          }
        });
        
        videoHTML += `</div>`;
      }

      let panoramaHTML = '';
      if (plot.panorama) {
        panoramaHTML = `
          <div class="mt-6">
            <div class="flex items-center justify-between mb-2">
              <div class="text-xs text-gray-400">360° PANORAMA</div>

    function importPlots() {

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      const ext = file.name.toLowerCase().split('.').pop();

      reader.onload = function(ev) {
        if (['csv', 'txt'].includes(ext)) importedData = parseCSV(ev.target.result);
        else if (['json'].includes(ext)) importedData = JSON.parse(ev.target.result);
        else if (['xlsx', 'xls'].includes(ext)) {
          const wb = XLSX.read(ev.target.result, { type: 'binary' });
          importedData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        }
        headers = Object.keys(importedData[0] || {});
      };

      if (['xlsx', 'xls'].includes(ext)) reader.readAsBinaryString(file);
      else reader.readAsText(file);
    }

    function parseCSV(csv) {
      const lines = csv.split('\n');
      const header = lines[0].split(',').map(h => h.trim());
      return lines.slice(1).map(line => {
        const values = line.split(',');
        return header.reduce((obj, h, i) => { obj[h] = values[i]?.trim(); return obj; }, {});
      }).filter(r => Object.keys(r).length);
    }

    function confirmImport() {
      let added = 0;
      importedData.forEach(item => {
        const no = (item['Plot No'] || `P-${Date.now()}`).toString().trim();
        if (plots.some(p => p.no === no)) return;
        plots.push({
          id: plots.length + added,
          no: no,
          dev: item['Development'] || "Imported",
          size: item['Size'] || "1000",
          price: item['Price'] || "3500000",
          status: item['Status'] || "Available",
          lat: 25.25 + Math.random()*0.15,
          lng: 55.27 + Math.random()*0.15
        });
        added++;
      });
      alert(`✅ Imported ${added} plots!`);
      closeImportModal();
      populateTable();
    }

    // ==================== DISTANCE CALCULATOR ====================
    let distanceMode = false;
    let firstPoint = null;
    let distanceMarker1 = null;
    let distanceMarker2 = null;

    function startDistanceCalculator() {
      distanceMode = true;
      firstPoint = null;
      
      if (distanceMarker1) distanceMarker1.remove();
      if (distanceMarker2) distanceMarker2.remove();
      
      alert('Click on the map to select the first point');
      
      map.getCanvas().style.cursor = 'crosshair';
      
      map.once('click', function(e) {
        firstPoint = [e.lngLat.lng, e.lngLat.lat];
        
        const el1 = document.createElement('div');
        el1.style.cssText = 'width:20px;height:20px;border-radius:50%;background:#a855f7;border:3px solid white;box-shadow:0 0 15px #a855f7;';
        
        distanceMarker1 = new mapboxgl.Marker(el1)
          .setLngLat(firstPoint)
          .addTo(map);
        
        alert('Now click on the second point');
        
        map.once('click', function(e2) {
          const secondPoint = [e2.lngLat.lng, e2.lngLat.lat];
          
          const el2 = document.createElement('div');
          el2.style.cssText = 'width:20px;height:20px;border-radius:50%;background:#a855f7;border:3px solid white;box-shadow:0 0 15px #a855f7;';
          
          distanceMarker2 = new mapboxgl.Marker(el2)
            .setLngLat(secondPoint)
            .addTo(map);
          
          const distance = calculateDistance(firstPoint[1], firstPoint[0], secondPoint[1], secondPoint[0]);
          
          if (map.getSource('distance-line')) {
            map.removeLayer('distance-line');
            map.removeSource('distance-line');
          }
          
          map.addSource('distance-line', {
            'type': 'geojson',
            'data': {
              'type': 'Feature',
              'geometry': {
                'type': 'LineString',
                'coordinates': [firstPoint, secondPoint]
              }
            }
          });
          
          map.addLayer({
            'id': 'distance-line',
            'type': 'line',
            'source': 'distance-line',
            'layout': {},
            'paint': {
              'line-color': '#a855f7',
              'line-width': 3,
              'line-dasharray': [2, 1]
            }
          });
          
          const popup = new mapboxgl.Popup({ closeOnClick: false })
            .setLngLat([
              (firstPoint[0] + secondPoint[0]) / 2,
              (firstPoint[1] + secondPoint[1]) / 2
            ])
            .setHTML(`
              <div class="text-center p-2">
                <div class="text-lg font-bold text-purple-400">${distance.toFixed(0)} meters</div>
                <div class="text-sm text-gray-400">${(distance / 1000).toFixed(2)} km</div>
                <button onclick="clearDistanceMeasurement()" class="mt-2 px-4 py-1 bg-red-600 rounded text-xs">Clear</button>
              </div>
            `)
            .addTo(map);
          
          map.getCanvas().style.cursor = '';
          distanceMode = false;
        });
      });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return R * c;
    }

    function clearDistanceMeasurement() {
      if (distanceMarker1) distanceMarker1.remove();
      if (distanceMarker2) distanceMarker2.remove();
      
      if (map.getLayer('distance-line')) map.removeLayer('distance-line');
      if (map.getSource('distance-line')) map.removeSource('distance-line');
      
      document.querySelectorAll('.mapboxgl-popup').forEach(p => p.remove());
      
      distanceMode = false;
      firstPoint = null;
      map.getCanvas().style.cursor = '';
    }

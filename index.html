<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Plot Portal • Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col">
      <div class="p-6 border-b border-gray-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center">
            <i class="fas fa-map-marked text-white text-xl"></i>
          </div>
          <div>
            <h1 class="text-2xl font-bold">AI Plot</h1>
            <p class="text-xs text-gray-500 -mt-1">Pro Edition</p>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-4">
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-blue-600 text-white">
          <i class="fas fa-map-marker-alt"></i> Plots
        </a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
      <div class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-8">
        <h2 class="text-2xl font-semibold">Plot Management</h2>
        <div class="flex gap-4">
          <button onclick="importPlots()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-file-import"></i> Import
          </button>
          <button onclick="exportCSV()" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-download"></i> Export
          </button>
          <button onclick="showNewPlotModal()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-plus"></i> New Plot
          </button>
        </div>
      </div>

      <div class="flex-1 p-8">
        <!-- SEARCH AND FILTERS -->
        <div class="mb-6">
          <div class="flex gap-4 items-center">
            <!-- GLOBAL SEARCH BAR -->
            <div class="flex-1 relative">
              <div class="absolute left-4 top-3.5 text-gray-400">
                <i class="fas fa-search"></i>
              </div>
              <input type="text" id="globalSearch" placeholder="Search plots by number, development, owner, type..." 
                class="w-full bg-gray-800 pl-12 pr-5 py-3 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                oninput="applySearchFilters()">
              <button onclick="clearSearch()" class="absolute right-4 top-3.5 text-gray-400 hover:text-white">
                <i class="fas fa-times"></i>
              </button>
            </div>

            <!-- QUICK FILTERS -->
            <div class="flex gap-2">
              <button onclick="quickFilter('available')" class="px-4 py-3 bg-green-600 hover:bg-green-700 rounded-2xl text-sm font-medium flex items-center gap-2">
                <i class="fas fa-check-circle"></i> Available
              </button>
              <button onclick="quickFilter('reserved')" class="px-4 py-3 bg-orange-600 hover:bg-orange-700 rounded-2xl text-sm font-medium flex items-center gap-2">
                <i class="fas fa-clock"></i> Reserved
              </button>
              <button onclick="quickFilter('sold')" class="px-4 py-3 bg-red-600 hover:bg-red-700 rounded-2xl text-sm font-medium flex items-center gap-2">
                <i class="fas fa-handshake"></i> Sold
              </button>
            </div>

            <!-- ADVANCED FILTER TOGGLE -->
            <button onclick="toggleAdvancedFilters()" class="px-4 py-3 bg-gray-800 hover:bg-gray-700 rounded-2xl text-sm font-medium flex items-center gap-2">
              <i class="fas fa-filter"></i> Filters
            </button>
          </div>

          <!-- ADVANCED FILTERS PANEL -->
          <div id="advancedFilters" class="hidden mt-4 bg-gray-800 rounded-2xl p-6 border border-gray-700">
            <div class="grid grid-cols-4 gap-6">
              <!-- Price Range -->
              <div>
                <label class="block text-xs text-gray-400 mb-2">PRICE RANGE (AED)</label>
                <div class="flex gap-3">
                  <input type="number" id="minPrice" placeholder="Min" class="flex-1 bg-gray-900 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500" oninput="applySearchFilters()">
                  <input type="number" id="maxPrice" placeholder="Max" class="flex-1 bg-gray-900 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500" oninput="applySearchFilters()">
                </div>
              </div>

              <!-- Size Range -->
              <div>
                <label class="block text-xs text-gray-400 mb-2">SIZE RANGE (GFA sqm)</label>
                <div class="flex gap-3">
                  <input type="number" id="minSize" placeholder="Min" class="flex-1 bg-gray-900 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500" oninput="applySearchFilters()">
                  <input type="number" id="maxSize" placeholder="Max" class="flex-1 bg-gray-900 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500" oninput="applySearchFilters()">
                </div>
              </div>

              <!-- Plot Type -->
              <div>
                <label class="block text-xs text-gray-400 mb-2">PLOT TYPE</label>
                <select id="typeFilter" onchange="applySearchFilters()" class="w-full bg-gray-900 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                  <option value="">All Types</option>
                  <option value="Residential">Residential</option>
                  <option value="Commercial">Commercial</option>
                  <option value="Industrial">Industrial</option>
                  <option value="School">School / Educational</option>
                  <option value="Camp">Camp / Labor</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <!-- Status -->
              <div>
                <label class="block text-xs text-gray-400 mb-2">STATUS</label>
                <select id="statusFilter" onchange="applySearchFilters()" class="w-full bg-gray-900 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                  <option value="">All Status</option>
                  <option value="Available">Available</option>
                  <option value="Reserved">Reserved</option>
                  <option value="Sold">Sold</option>
                </select>
              </div>
            </div>

            <div class="flex justify-end mt-4">
              <button onclick="clearAllFilters()" class="px-6 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm font-medium flex items-center gap-2">
                <i class="fas fa-times"></i> Clear All Filters
              </button>
            </div>
          </div>
        </div>

        <!-- MAP VIEW -->
        <div id="mapView">
          <div class="bg-gray-900 rounded-3xl overflow-hidden border border-gray-800" style="height: 600px; position: relative;">
            <div id="map" style="height: 100%; width: 100%; min-height: 600px;"></div>
            
            <!-- SEARCH RESULTS COUNT -->
            <div id="searchResultsCount" class="absolute bottom-5 left-5 bg-gray-900/95 backdrop-blur-xl px-4 py-2 rounded-2xl text-sm border border-gray-700 hidden">
              <span id="resultsText">Showing all plots</span>
            </div>
          </div>
        </div>

        <!-- TABLE VIEW -->
        <div id="tableView" class="hidden">
          <div class="bg-gray-900 rounded-3xl border border-gray-800 overflow-hidden">
            <table class="w-full text-sm">
              <thead class="border-b border-gray-700 bg-gray-950">
                <tr>
                  <th class="text-left py-4 px-6">Plot No</th>
                  <th class="text-left py-4 px-6">Development</th>
                  <th class="text-left py-4 px-6">Type</th>
                  <th class="text-left py-4 px-6">Size</th>
                  <th class="text-left py-4 px-6">Price</th>
                  <th class="text-left py-4 px-6">Status</th>
                  <th class="text-left py-4 px-6">Owner</th>
                  <th class="text-left py-4 px-6">Actions</th>
                </tr>
              </thead>
              <tbody id="plotTableBody" class="divide-y divide-gray-800"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE: PLOT INFORMATION CARD -->
    <div id="mapCard" class="w-96 bg-gray-900 border-l border-gray-800 p-6 overflow-auto hidden">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold">Plot Details</h3>
        <button onclick="closeCard()" class="text-3xl text-gray-400 hover:text-white">×</button>
      </div>
      <div id="plotDetailsContent"></div>
    </div>
  </div>

  <!-- NEW PLOT MODAL -->
  <div id="plotModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[9999] flex items-center justify-center">
    <div class="bg-gray-900 rounded-3xl w-[700px] border border-gray-700 shadow-2xl max-h-[90vh] overflow-auto">
      <div class="px-8 py-6 border-b border-gray-700 flex justify-between items-center sticky top-0 bg-gray-900 z-10">
        <div>
          <h3 class="text-2xl font-bold" id="modalTitle">Add New Plot</h3>
          <p class="text-sm text-gray-400" id="modalSubtitle">Enter complete plot information</p>
        </div>
        <button onclick="closePlotModal()" class="text-3xl text-gray-400 hover:text-white">×</button>
      </div>
      
      <div class="p-8 space-y-6">
        <div class="grid grid-cols-2 gap-5">
          <div><label class="block text-xs text-gray-400 mb-1.5">Plot Number *</label><input type="text" id="plotNo" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm"></div>
          <div><label class="block text-xs text-gray-400 mb-1.5">Development *</label><input type="text" id="plotDev" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm"></div>
        </div>

        <div><label class="block text-xs text-gray-400 mb-1.5">Plot Type</label><select id="plotType" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm"><option value="Residential">Residential</option><option value="Commercial">Commercial</option><option value="Industrial">Industrial</option><option value="School">School</option><option value="Camp">Camp</option><option value="Other">Other</option></select></div>

        <div class="border border-gray-700 rounded-2xl p-5">
          <div class="text-xs text-gray-400 mb-3 font-semibold">AREA INFORMATION</div>
          <div class="grid grid-cols-2 gap-5">
            <div><label class="block text-xs text-gray-400 mb-1.5">GFA (sqm)</label><input type="number" id="plotGFA" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm" value="2500"></div>
            <div><label class="block text-xs text-gray-400 mb-1.5">NFA (sqm)</label><input type="number" id="plotNFA" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm" value="2100"></div>
            <div><label class="block text-xs text-gray-400 mb-1.5">FAR</label><input type="number" step="0.1" id="plotFAR" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm" value="2.5"></div>
            <div><label class="block text-xs text-gray-400 mb-1.5">BUA (sqm)</label><input type="number" id="plotBUA" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm" value="1800"></div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-5">
          <div><label class="block text-xs text-gray-400 mb-1.5">Price (AED) *</label><input type="number" id="plotPrice" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm" value="4500000"></div>
          <div><label class="block text-xs text-gray-400 mb-1.5">Status</label><select id="plotStatus" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm"><option value="Available">Available</option><option value="Reserved">Reserved</option><option value="Sold">Sold</option></select></div>
        </div>

        <div class="border border-gray-700 rounded-2xl p-5">
          <div class="text-xs text-gray-400 mb-3 font-semibold">OWNER INFORMATION</div>
          <div class="grid grid-cols-1 gap-4">
            <div><label class="block text-xs text-gray-400 mb-1.5">Owner Name *</label><input type="text" id="plotOwner" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm" placeholder="Ahmed Al Maktoum"></div>
            <div class="grid grid-cols-2 gap-4">
              <div><label class="block text-xs text-gray-400 mb-1.5">Phone</label><input type="text" id="plotPhone" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm" placeholder="+971 50 123 4567"></div>
              <div><label class="block text-xs text-gray-400 mb-1.5">Email</label><input type="email" id="plotEmail" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm" placeholder="owner@email.com"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="px-8 py-5 border-t border-gray-700 flex gap-3 bg-gray-950 sticky bottom-0">
        <button onclick="closePlotModal()" class="flex-1 py-4 rounded-2xl border border-gray-600 hover:bg-gray-800 text-sm font-medium">Cancel</button>
        <button onclick="savePlot()" class="flex-1 py-4 bg-blue-600 hover:bg-blue-700 rounded-2xl text-sm font-medium" id="saveBtn">Add Plot</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    let map;
    let plots = [
      { id: 0, no: "A-128", lat: 25.2769, lng: 55.2962, dev: "Dubai Hills Estate", type: "Residential", gfa: "2500", nfa: "2100", far: "2.5", bua: "1800", price: "4375000", status: "Available", owner: "Ahmed Al Maktoum", phone: "+971 50 123 4567", email: "ahmed@email.com" },
      { id: 1, no: "B-305", lat: 25.2482, lng: 55.3123, dev: "Emirates Hills", type: "Commercial", gfa: "1800", nfa: "1500", far: "3.2", bua: "1200", price: "6200000", status: "Reserved", owner: "Fatima Hassan", phone: "+971 55 987 6543", email: "fatima@email.com" },
      { id: 2, no: "C-042", lat: 25.2891, lng: 55.3784, dev: "Arabian Ranches", type: "Industrial", gfa: "4500", nfa: "3800", far: "1.8", bua: "3200", price: "8900000", status: "Sold", owner: "Mohammed Al Rashid", phone: "+971 52 456 7890", email: "mohammed@email.com" },
      { id: 3, no: "D-215", lat: 25.2654, lng: 55.3241, dev: "Palm Jumeirah", type: "Residential", gfa: "3200", nfa: "2800", far: "2.8", bua: "2400", price: "12500000", status: "Available", owner: "Khalid Al Suwaidi", phone: "+971 54 321 9876", email: "khalid@email.com" },
      { id: 4, no: "E-078", lat: 25.3012, lng: 55.3518, dev: "Business Bay", type: "Commercial", gfa: "1500", nfa: "1300", far: "4.5", bua: "1100", price: "7800000", status: "Reserved", owner: "Sara Al Mulla", phone: "+971 56 789 0123", email: "sara@email.com" }
    ];
    let currentEditId = null;
    let currentSearchTerm = '';
    let advancedFiltersOpen = false;

    // ==================== MAP ====================
    function initMap() {
      map = L.map('map').setView([25.2769, 55.2962], 11);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);
      
      addMarkers();
      setTimeout(() => { if (map) map.invalidateSize(); }, 200);
    }

    function addMarkers(filteredPlots = null) {
      map.eachLayer(layer => { if (layer instanceof L.Marker) map.removeLayer(layer); });
      
      const plotsToShow = filteredPlots || plots;
      
      plotsToShow.forEach(plot => {
        const color = plot.status === 'Available' ? '#22c55e' : plot.status === 'Reserved' ? '#f59e0b' : '#ef4444';
        const marker = L.marker([plot.lat, plot.lng], {
          icon: L.divIcon({
            html: `<div style="background:${color};width:32px;height:32px;border-radius:50%;border:3px solid white;color:white;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.3);font-size:10px;">${plot.no}</div>`,
            iconSize: [32, 32]
          })
        }).addTo(map);
        
        marker.bindPopup(`
          <div style="min-width:200px;">
            <div style="font-weight:700;font-size:18px;margin-bottom:8px;">Plot ${plot.no}</div>
            <div style="color:#666;margin-bottom:12px;">${plot.dev}</div>
            <div style="background:${color};color:white;padding:4px 12px;border-radius:20px;display:inline-block;">${plot.status}</div>
          </div>
        `);
        
        marker.on('click', () => selectPlot(plot.id));
      });
    }

    function selectPlot(id) {
      const plot = plots.find(p => p.id === id);
      const card = document.getElementById('mapCard');
      const content = document.getElementById('plotDetailsContent');
      
      card.classList.remove('hidden');
      
      content.innerHTML = `
        <div class="mb-6">
          <div class="flex items-center justify-between mb-4">
            <div>
              <div class="text-4xl font-bold">Plot ${plot.no}</div>
              <div class="text-blue-400 text-lg">${plot.dev}</div>
            </div>
            <div class="px-6 py-2 rounded-2xl text-sm font-bold ${plot.status === 'Available' ? 'bg-green-600' : plot.status === 'Reserved' ? 'bg-orange-600' : 'bg-red-600'}">${plot.status}</div>
          </div>
        </div>

        <div class="mb-6">
          <div class="text-xs text-gray-400 mb-2">CHANGE STATUS</div>
          <div class="flex gap-2">
            <button onclick="changePlotStatus(${plot.id}, 'Available')" class="flex-1 py-3 bg-green-600 hover:bg-green-700 rounded-xl text-sm font-medium">Available</button>
            <button onclick="changePlotStatus(${plot.id}, 'Reserved')" class="flex-1 py-3 bg-orange-600 hover:bg-orange-700 rounded-xl text-sm font-medium">Reserved</button>
            <button onclick="changePlotStatus(${plot.id}, 'Sold')" class="flex-1 py-3 bg-red-600 hover:bg-red-700 rounded-xl text-sm font-medium">Sold</button>
          </div>
        </div>

        <div class="space-y-4">
          <div class="bg-gray-800 rounded-2xl p-4">
            <div class="text-xs text-gray-400 mb-3">PLOT TYPE</div>
            <div class="font-bold text-lg">${plot.type || 'Residential'}</div>
          </div>

          <div class="bg-gray-800 rounded-2xl p-4">
            <div class="text-xs text-gray-400 mb-3">AREA INFORMATION</div>
            <div class="grid grid-cols-2 gap-4 text-sm">
              <div><div class="text-gray-400">GFA</div><div class="font-bold">${plot.gfa || 'N/A'} sqm</div></div>
              <div><div class="text-gray-400">NFA</div><div class="font-bold">${plot.nfa || 'N/A'} sqm</div></div>
              <div><div class="text-gray-400">FAR</div><div class="font-bold">${plot.far || 'N/A'}</div></div>
              <div><div class="text-gray-400">BUA</div><div class="font-bold">${plot.bua || 'N/A'} sqm</div></div>
            </div>
          </div>

          <div class="bg-gray-800 rounded-2xl p-4">
            <div class="text-xs text-gray-400 mb-3">PRICING</div>
            <div class="text-3xl font-bold text-green-400">AED ${Number(plot.price).toLocaleString()}</div>
          </div>

          <div class="bg-gray-800 rounded-2xl p-4">
            <div class="text-xs text-gray-400 mb-3">OWNER INFORMATION</div>
            <div class="space-y-2">
              <div class="flex items-center gap-3"><i class="fas fa-user text-gray-400 w-4"></i><span class="font-bold">${plot.owner || 'N/A'}</span></div>
              <div class="flex items-center gap-3"><i class="fas fa-phone text-gray-400 w-4"></i><span>${plot.phone || 'N/A'}</span></div>
              <div class="flex items-center gap-3"><i class="fas fa-envelope text-gray-400 w-4"></i><span class="text-blue-400">${plot.email || 'N/A'}</span></div>
            </div>
          </div>
        </div>

        <div class="mt-6 flex gap-3">
          <button onclick="editPlot(${plot.id}); closeCard()" class="flex-1 py-4 bg-blue-600 hover:bg-blue-700 rounded-2xl text-sm font-medium">Edit Plot</button>
          <button onclick="deletePlot(${plot.id}); closeCard()" class="flex-1 py-4 border border-red-600 text-red-400 hover:bg-red-900/50 rounded-2xl text-sm font-medium">Delete</button>
        </div>
      `;
    }

    function changePlotStatus(id, newStatus) {
      const plot = plots.find(p => p.id === id);
      if (!plot) return;
      
      plot.status = newStatus;
      map.eachLayer(layer => { if (layer instanceof L.Marker) map.removeLayer(layer); });
      addMarkers();
      renderTable();
      selectPlot(id);
      alert(`✅ Plot ${plot.no} status changed to ${newStatus}`);
    }

    function closeCard() { document.getElementById('mapCard').classList.add('hidden'); }

    function showMapView() {
      document.getElementById('mapView').classList.remove('hidden');
      document.getElementById('tableView').classList.add('hidden');
      setTimeout(() => { if (map) map.invalidateSize(); }, 100);
    }

    function showTableView() {
      document.getElementById('mapView').classList.add('hidden');
      document.getElementById('tableView').classList.remove('hidden');
      renderTable();
    }

    function renderTable(filteredPlots = null) {
      const tbody = document.getElementById('plotTableBody');
      const plotsToShow = filteredPlots || plots;
      
      tbody.innerHTML = plotsToShow.map(plot => `
        <tr class="hover:bg-gray-800">
          <td class="py-4 px-6 font-bold">${highlightMatch(plot.no, currentSearchTerm)}</td>
          <td class="py-4 px-6">${highlightMatch(plot.dev, currentSearchTerm)}</td>
          <td class="py-4 px-6"><span class="px-2 py-0.5 rounded-full text-xs bg-gray-700">${plot.type || 'Residential'}</span></td>
          <td class="py-4 px-6">${plot.gfa || plot.size} sqm</td>
          <td class="py-4 px-6">AED ${Number(plot.price).toLocaleString()}</td>
          <td class="py-4 px-6"><span class="px-4 py-1 rounded-full text-xs ${plot.status === 'Available' ? 'bg-green-500' : plot.status === 'Reserved' ? 'bg-orange-500' : 'bg-red-500'}">${plot.status}</span></td>
          <td class="py-4 px-6">${highlightMatch(plot.owner || 'N/A', currentSearchTerm)}</td>
          <td class="py-4 px-6">
            <button onclick="selectPlot(${plot.id}); showMapView()" class="text-blue-400 hover:text-blue-300 mr-3">View</button>
            <button onclick="deletePlot(${plot.id})" class="text-red-400 hover:text-red-300">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function highlightMatch(text, searchTerm) {
      if (!searchTerm || !text) return text;
      
      const regex = new RegExp(`(${searchTerm})`, 'gi');
      return text.toString().replace(regex, '<mark class="bg-yellow-400 text-black px-1 rounded">$1</mark>');
    }

    // ==================== SEARCH & FILTERING ====================
    
    function applySearchFilters() {
      const searchTerm = document.getElementById('globalSearch').value.toLowerCase().trim();
      currentSearchTerm = searchTerm;
      
      const minPrice = parseFloat(document.getElementById('minPrice')?.value) || 0;
      const maxPrice = parseFloat(document.getElementById('maxPrice')?.value) || Infinity;
      const minSize = parseFloat(document.getElementById('minSize')?.value) || 0;
      const maxSize = parseFloat(document.getElementById('maxSize')?.value) || Infinity;
      const typeFilter = document.getElementById('typeFilter')?.value || '';
      const statusFilter = document.getElementById('statusFilter')?.value || '';
      
      let filtered = plots.filter(plot => {
        let matchesSearch = true;
        if (searchTerm) {
          matchesSearch = 
            plot.no.toLowerCase().includes(searchTerm) ||
            plot.dev.toLowerCase().includes(searchTerm) ||
            (plot.owner && plot.owner.toLowerCase().includes(searchTerm)) ||
            (plot.type && plot.type.toLowerCase().includes(searchTerm)) ||
            plot.status.toLowerCase().includes(searchTerm) ||
            plot.price.toString().includes(searchTerm);
        }
        
        const priceMatch = plot.price >= minPrice && plot.price <= maxPrice;
        const size = parseFloat(plot.gfa) || 0;
        const sizeMatch = size >= minSize && size <= maxSize;
        const typeMatch = !typeFilter || plot.type === typeFilter;
        const statusMatch = !statusFilter || plot.status === statusFilter;
        
        return matchesSearch && priceMatch && sizeMatch && typeMatch && statusMatch;
      });
      
      addMarkers(filtered);
      renderTable(filtered);
      updateResultsCount(filtered.length, plots.length);
    }

    function updateResultsCount(filtered, total) {
      const countDiv = document.getElementById('searchResultsCount');
      const resultsText = document.getElementById('resultsText');
      
      if (filtered < total) {
        countDiv.classList.remove('hidden');
        resultsText.innerHTML = `Showing <span class="font-bold text-white">${filtered}</span> of <span class="font-bold text-white">${total}</span> plots`;
      } else {
        countDiv.classList.add('hidden');
      }
    }

    function clearSearch() {
      document.getElementById('globalSearch').value = '';
      currentSearchTerm = '';
      applySearchFilters();
    }

    function quickFilter(type) {
      document.getElementById('globalSearch').value = '';
      document.getElementById('minPrice').value = '';
      document.getElementById('maxPrice').value = '';
      document.getElementById('minSize').value = '';
      document.getElementById('maxSize').value = '';
      document.getElementById('typeFilter').value = '';
      
      if (type === 'available') {
        document.getElementById('statusFilter').value = 'Available';
      } else if (type === 'reserved') {
        document.getElementById('statusFilter').value = 'Reserved';
      } else if (type === 'sold') {
        document.getElementById('statusFilter').value = 'Sold';
      }
      
      applySearchFilters();
    }

    function toggleAdvancedFilters() {
      const filtersPanel = document.getElementById('advancedFilters');
      advancedFiltersOpen = !advancedFiltersOpen;
      
      if (advancedFiltersOpen) {
        filtersPanel.classList.remove('hidden');
      } else {
        filtersPanel.classList.add('hidden');
      }
    }

    function clearAllFilters() {
      document.getElementById('globalSearch').value = '';
      document.getElementById('minPrice').value = '';
      document.getElementById('maxPrice').value = '';
      document.getElementById('minSize').value = '';
      document.getElementById('maxSize').value = '';
      document.getElementById('typeFilter').value = '';
      document.getElementById('statusFilter').value = '';
      
      currentSearchTerm = '';
      
      addMarkers();
      renderTable();
      document.getElementById('searchResultsCount').classList.add('hidden');
      document.getElementById('advancedFilters').classList.add('hidden');
      advancedFiltersOpen = false;
    }

    // ==================== NEW PLOT MODAL ====================
    
    function showNewPlotModal() {
      currentEditId = null;
      document.getElementById('modalTitle').textContent = 'Add New Plot';
      document.getElementById('modalSubtitle').textContent = 'Enter complete plot information';
      document.getElementById('saveBtn').textContent = 'Add Plot';
      
      document.getElementById('plotNo').value = `D-${Date.now().toString().slice(-4)}`;
      document.getElementById('plotDev').value = 'New Development';
      document.getElementById('plotType').value = 'Residential';
      document.getElementById('plotGFA').value = '2500';
      document.getElementById('plotNFA').value = '2100';
      document.getElementById('plotFAR').value = '2.5';
      document.getElementById('plotBUA').value = '1800';
      document.getElementById('plotPrice').value = '4500000';
      document.getElementById('plotStatus').value = 'Available';
      document.getElementById('plotOwner').value = 'New Owner';
      document.getElementById('plotPhone').value = '+971 50 000 0000';
      document.getElementById('plotEmail').value = 'owner@email.com';
      
      document.getElementById('plotModal').classList.remove('hidden');
    }

    function editPlot(id) {
      const plot = plots.find(p => p.id === id);
      if (!plot) return;
      
      currentEditId = id;
      document.getElementById('modalTitle').textContent = 'Edit Plot';
      document.getElementById('modalSubtitle').textContent = `Editing Plot ${plot.no}`;
      document.getElementById('saveBtn').textContent = 'Save Changes';
      
      document.getElementById('plotNo').value = plot.no;
      document.getElementById('plotDev').value = plot.dev;
      document.getElementById('plotType').value = plot.type || 'Residential';
      document.getElementById('plotGFA').value = plot.gfa || '2500';
      document.getElementById('plotNFA').value = plot.nfa || '2100';
      document.getElementById('plotFAR').value = plot.far || '2.5';
      document.getElementById('plotBUA').value = plot.bua || '1800';
      document.getElementById('plotPrice').value = plot.price;
      document.getElementById('plotStatus').value = plot.status;
      document.getElementById('plotOwner').value = plot.owner || '';
      document.getElementById('plotPhone').value = plot.phone || '';
      document.getElementById('plotEmail').value = plot.email || '';
      
      document.getElementById('plotModal').classList.remove('hidden');
    }

    function closePlotModal() {
      document.getElementById('plotModal').classList.add('hidden');
    }

    function savePlot() {
      const no = document.getElementById('plotNo').value.trim();
      const dev = document.getElementById('plotDev').value.trim();
      const type = document.getElementById('plotType').value;
      const gfa = document.getElementById('plotGFA').value;
      const nfa = document.getElementById('plotNFA').value;
      const far = document.getElementById('plotFAR').value;
      const bua = document.getElementById('plotBUA').value;
      const price = document.getElementById('plotPrice').value;
      const status = document.getElementById('plotStatus').value;
      const owner = document.getElementById('plotOwner').value.trim();
      const phone = document.getElementById('plotPhone').value.trim();
      const email = document.getElementById('plotEmail').value.trim();
      
      if (!no || !dev || !owner || !price) {
        alert('Please fill in all required fields (Plot Number, Development, Owner Name, Price)');
        return;
      }
      
      if (currentEditId !== null) {
        const plot = plots.find(p => p.id === currentEditId);
        plot.no = no;
        plot.dev = dev;
        plot.type = type;
        plot.gfa = gfa;
        plot.nfa = nfa;
        plot.far = far;
        plot.bua = bua;
        plot.price = price;
        plot.status = status;
        plot.owner = owner;
        plot.phone = phone;
        plot.email = email;
        
        alert(`✅ Plot ${no} updated successfully!`);
      } else {
        const newPlot = {
          id: plots.length,
          no: no,
          lat: 25.25 + Math.random() * 0.15,
          lng: 55.27 + Math.random() * 0.15,
          dev: dev,
          type: type,
          gfa: gfa,
          nfa: nfa,
          far: far,
          bua: bua,
          price: price,
          status: status,
          owner: owner,
          phone: phone,
          email: email
        };
        
        plots.push(newPlot);
        alert(`✅ New plot ${no} added successfully!`);
      }
      
      closePlotModal();
      addMarkers();
      renderTable();
    }

    // ==================== IMPORT ====================
    
    function importPlots() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.csv,.xlsx,.xls,.json,.txt,.pdf';
      
      input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        const ext = file.name.toLowerCase().split('.').pop();
        
        reader.onload = function(ev) {
          let data = [];
          
          try {
            if (['csv', 'txt'].includes(ext)) {
              data = parseCSV(ev.target.result);
            } else if (['xlsx', 'xls'].includes(ext)) {
              const wb = XLSX.read(ev.target.result, { type: 'binary' });
              data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            } else if (ext === 'json') {
              data = JSON.parse(ev.target.result);
            } else if (ext === 'pdf') {
              const text = new TextDecoder().decode(ev.target.result);
              data = parsePDFText(text);
            }
            
            let added = 0;
            let skipped = 0;
            
            data.forEach((item, index) => {
              const no = (item['Plot No'] || item['plot_no'] || `P-${Date.now() + index}`).toString().trim();
              const dev = (item['Development'] || item['development'] || 'Imported').toString().trim();
              const price = parseFloat(item['Price'] || item['price'] || 3500000);
              const status = (item['Status'] || item['status'] || 'Available').toString().trim();
              const owner = (item['Owner'] || item['owner'] || 'Imported Owner').toString().trim();
              const phone = (item['Phone'] || item['phone'] || '+971 50 000 0000').toString().trim();
              const email = (item['Email'] || item['email'] || 'owner@email.com').toString().trim();
              
              if (!no || !dev || !price) {
                skipped++;
                return;
              }
              
              if (plots.some(p => p.no.toLowerCase() === no.toLowerCase())) {
                skipped++;
                return;
              }
              
              plots.push({
                id: plots.length,
                no: no,
                lat: 25.25 + Math.random() * 0.15,
                lng: 55.27 + Math.random() * 0.15,
                dev: dev,
                type: item['Type'] || item['type'] || 'Residential',
                gfa: item['GFA'] || item['gfa'] || '2000',
                nfa: item['NFA'] || item['nfa'] || '1700',
                far: item['FAR'] || item['far'] || '2.0',
                bua: item['BUA'] || item['bua'] || '1500',
                price: price,
                status: ['Available', 'Reserved', 'Sold'].includes(status) ? status : 'Available',
                owner: owner,
                phone: phone,
                email: email
              });
              
              added++;
            });
            
            addMarkers();
            renderTable();
            alert(`✅ Import Complete!\n\nImported: ${added} plots\nSkipped: ${skipped} plots`);
            
          } catch (error) {
            alert('Error reading file: ' + error.message);
          }
        };
        
        if (['xlsx', 'xls'].includes(ext)) {
          reader.readAsBinaryString(file);
        } else if (ext === 'pdf') {
          reader.readAsArrayBuffer(file);
        } else {
          reader.readAsText(file);
        }
      };
      
      input.click();
    }

    function parseCSV(csv) {
      const lines = csv.split('\n').filter(l => l.trim().length > 0);
      if (lines.length === 0) return [];
      
      const header = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
      
      return lines.slice(1).map(line => {
        const values = line.split(',').map(v => v.trim().replace(/"/g, ''));
        const obj = {};
        header.forEach((h, i) => { obj[h] = values[i] || ''; });
        return obj;
      }).filter(r => Object.keys(r).length > 1);
    }

    function parsePDFText(text) {
      const lines = text.split('\n').filter(l => l.trim().length > 10);
      return lines.slice(0, 20).map((line, index) => ({
        'Plot No': `P-${1000 + index}`,
        'Development': line.substring(0, 60).trim(),
        'Price': Math.floor(Math.random() * 5000000) + 2000000,
        'Status': 'Available',
        'Owner': 'Imported Owner'
      }));
    }

    // ==================== UTILITY ====================
    
    function addNewPlot() {
      showNewPlotModal();
    }

    function deletePlot(id) {
      if (!confirm('Delete this plot?')) return;
      plots = plots.filter(p => p.id !== id);
      map.eachLayer(layer => { if (layer instanceof L.Marker) map.removeLayer(layer); });
      addMarkers();
      renderTable();
    }

    function exportCSV() {
      let csv = "Plot No,Development,Type,GFA,NFA,FAR,BUA,Price,Status,Owner,Phone,Email\n";
      plots.forEach(p => csv += `${p.no},${p.dev},${p.type},${p.gfa},${p.nfa},${p.far},${p.bua},${p.price},${p.status},${p.owner},${p.phone},${p.email}\n`);
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'plots_export.csv';
      a.click();
    }

    // ==================== INITIALIZE ====================
    window.onload = () => {
      initMap();
      renderTable();
      console.log('✅ Portal with Search Filtering loaded successfully');
    };
  </script>

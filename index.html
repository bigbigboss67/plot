<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Plot Portal • Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  
  <style>
    .offline-banner {
      background: linear-gradient(90deg, #ef4444, #f97316);
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100">

  <!-- Top Bar -->
  <div class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-4 md:px-8">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-blue-600 rounded-2xl flex items-center justify-center">
          <i class="fas fa-map-marked text-white"></i>
        </div>
        <h1 class="text-2xl font-bold">AI Plot</h1>
      </div>
      
      <!-- Online/Offline Status -->
      <div id="connectionStatus" class="flex items-center gap-2 px-3 py-1 bg-green-900/30 text-green-400 rounded-2xl text-xs font-medium">
        <i class="fas fa-wifi"></i>
        <span>Online</span>
      </div>
    </div>

    <div class="flex gap-3">
      <button onclick="toggleCloudSync()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-2xl text-sm font-medium flex items-center gap-2">
        <i class="fas fa-cloud"></i> <span class="hidden md:inline">Cloud Sync</span>
      </button>
      
      <button onclick="showNewPlotModal()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
        <i class="fas fa-plus"></i> New Plot
      </button>
    </div>
  </div>

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div class="w-64 bg-gray-900 border-r border-gray-800 p-4 hidden md:block">
      <div class="space-y-2">
        <button onclick="showAnalytics()" class="w-full text-left px-4 py-3 rounded-2xl hover:bg-gray-800 flex items-center gap-3">
          <i class="fas fa-chart-line"></i> Analytics
        </button>
        <button onclick="showPlots()" class="w-full text-left px-4 py-3 rounded-2xl bg-blue-600 flex items-center gap-3">
          <i class="fas fa-map-marker-alt"></i> Plots
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-6 overflow-auto">
      <!-- Analytics -->
      <div id="analyticsView" class="hidden">
        <h2 class="text-3xl font-bold mb-8">Real Estate Analytics</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
          <div class="bg-gray-900 border border-gray-700 rounded-3xl p-6">
            <div class="text-sm text-gray-400">Total Plots</div>
            <div id="totalPlots" class="text-5xl font-bold mt-2">0</div>
          </div>
          <div class="bg-gray-900 border border-gray-700 rounded-3xl p-6">
            <div class="text-sm text-gray-400">Portfolio Value</div>
            <div id="totalValue" class="text-5xl font-bold mt-2 text-green-400">AED 0</div>
          </div>
          <div class="bg-gray-900 border border-gray-700 rounded-3xl p-6">
            <div class="text-sm text-gray-400">Available</div>
            <div id="availablePlots" class="text-5xl font-bold mt-2">0</div>
          </div>
          <div class="bg-gray-900 border border-gray-700 rounded-3xl p-6">
            <div class="text-sm text-gray-400">Avg Price/GFA</div>
            <div id="avgPrice" class="text-5xl font-bold mt-2">AED 0</div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-gray-900 border border-gray-700 rounded-3xl p-6">
            <div class="font-bold mb-4">Status Distribution</div>
            <canvas id="statusChart" height="120"></canvas>
          </div>
          <div class="bg-gray-900 border border-gray-700 rounded-3xl p-6">
            <div class="font-bold mb-4">By Development</div>
            <canvas id="devChart" height="120"></canvas>
          </div>
        </div>
      </div>

      <!-- Plots View -->
      <div id="plotsView">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-3xl font-bold">Plots</h2>
          <input type="text" id="globalSearch" placeholder="Search plots..." 
                 class="bg-gray-800 px-5 py-3 rounded-2xl text-sm w-72 focus:outline-none focus:ring-2 focus:ring-blue-500"
                 oninput="applySearchFilters()">
        </div>

        <div class="bg-gray-900 rounded-3xl border border-gray-800 overflow-hidden">
          <table class="w-full text-sm">
            <thead class="border-b border-gray-700 bg-gray-950">
              <tr>
                <th class="text-left py-4 px-6">Plot No</th>
                <th class="text-left py-4 px-6">Development</th>
                <th class="text-left py-4 px-6">Size</th>
                <th class="text-left py-4 px-6">Price</th>
                <th class="text-left py-4 px-6">Status</th>
                <th class="text-left py-4 px-6">Actions</th>
              </tr>
            </thead>
            <tbody id="plotTableBody" class="divide-y divide-gray-800"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- New Plot Modal -->
  <div id="plotModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[9999] flex items-center justify-center">
    <div class="bg-gray-900 rounded-3xl w-[700px] border border-gray-700 shadow-2xl">
      <div class="px-8 py-6 border-b border-gray-700 flex justify-between items-center">
        <h3 class="text-2xl font-bold" id="modalTitle">Add New Plot</h3>
        <button onclick="closePlotModal()" class="text-3xl text-gray-400 hover:text-white">×</button>
      </div>
      
      <div class="p-8 space-y-6">
        <div class="grid grid-cols-2 gap-5">
          <div><label class="block text-xs text-gray-400 mb-1.5">Plot Number *</label><input type="text" id="plotNo" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm"></div>
          <div><label class="block text-xs text-gray-400 mb-1.5">Development *</label><input type="text" id="plotDev" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm"></div>
        </div>

        <div class="grid grid-cols-2 gap-5">
          <div><label class="block text-xs text-gray-400 mb-1.5">Total Price (AED) *</label><input type="number" id="plotPrice" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm" value="4500000"></div>
          <div><label class="block text-xs text-gray-400 mb-1.5">Status</label><select id="plotStatus" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm"><option value="Available">Available</option><option value="Reserved">Reserved</option><option value="Sold">Sold</option></select></div>
        </div>

        <div class="border border-red-900/50 bg-red-950/30 rounded-2xl p-5">
          <div class="flex items-center gap-2 mb-3">
            <i class="fas fa-lock text-red-400"></i>
            <div class="text-xs text-red-400 font-semibold">OWNER INFORMATION (INTERNAL ONLY)</div>
          </div>
          <div class="grid grid-cols-1 gap-4">
            <div><label class="block text-xs text-gray-400 mb-1.5">Owner Name</label><input type="text" id="plotOwner" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm"></div>
            <div class="grid grid-cols-2 gap-4">
              <div><label class="block text-xs text-gray-400 mb-1.5">Phone</label><input type="text" id="plotPhone" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm"></div>
              <div><label class="block text-xs text-gray-400 mb-1.5">Email</label><input type="email" id="plotEmail" class="w-full bg-gray-800 rounded-2xl px-5 py-3 text-sm"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="px-8 py-5 border-t border-gray-700 flex gap-3 bg-gray-950">
        <button onclick="closePlotModal()" class="flex-1 py-4 rounded-2xl border border-gray-600 hover:bg-gray-800 text-sm font-medium">Cancel</button>
        <button onclick="savePlot()" class="flex-1 py-4 bg-blue-600 hover:bg-blue-700 rounded-2xl text-sm font-medium" id="saveBtn">Add Plot</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    let cloudSyncEnabled = false;
    let currentUserId = "default-user";
    let isOnline = navigator.onLine;

    let map;
    let plots = [];
    let currentEditId = null;

    // ==================== OFFLINE + ONLINE DETECTION ====================
    window.addEventListener('online', () => {
      isOnline = true;
      updateConnectionStatus();
      if (cloudSyncEnabled) {
        syncToCloud();
      }
    });

    window.addEventListener('offline', () => {
      isOnline = false;
      updateConnectionStatus();
    });

    function updateConnectionStatus() {
      const statusEl = document.getElementById('connectionStatus');
      
      if (isOnline) {
        statusEl.innerHTML = `<i class="fas fa-wifi"></i> <span>Online</span>`;
        statusEl.className = "flex items-center gap-2 px-3 py-1 bg-green-900/30 text-green-400 rounded-2xl text-xs font-medium";
      } else {
        statusEl.innerHTML = `<i class="fas fa-wifi-slash"></i> <span>Offline</span>`;
        statusEl.className = "flex items-center gap-2 px-3 py-1 bg-red-900/30 text-red-400 rounded-2xl text-xs font-medium";
      }
    }

    // ==================== CLOUD SYNC ====================
    function toggleCloudSync() {
      cloudSyncEnabled = !cloudSyncEnabled;
      localStorage.setItem('cloudSyncEnabled', cloudSyncEnabled);
      
      if (cloudSyncEnabled && isOnline) {
        startCloudListener();
        alert("✅ Cloud Sync Enabled - Changes will sync in real-time");
      } else if (cloudSyncEnabled && !isOnline) {
        alert("Cloud Sync enabled. Will sync when back online.");
      } else {
        alert("Cloud Sync Disabled");
      }
    }

    function startCloudListener() {
      if (!cloudSyncEnabled || !isOnline) return;
      
      const plotsRef = database.ref('plots/' + currentUserId);
      
      plotsRef.on('value', (snapshot) => {
        const cloudData = snapshot.val();
        if (cloudData) {
          plots = Object.values(cloudData);
          localStorage.setItem('aiPlotPortalData', JSON.stringify(plots));
          addMarkers();
          renderTable();
          updateAnalytics();
        }
      });
    }

    function syncToCloud() {
      if (!cloudSyncEnabled || !isOnline) return;
      
      const plotsRef = database.ref('plots/' + currentUserId);
      const dataToSync = {};
      
      plots.forEach(plot => {
        dataToSync[plot.id] = plot;
      });
      
      plotsRef.set(dataToSync);
    }

    // ==================== LOCAL STORAGE ====================
    function saveToLocalStorage() {
      localStorage.setItem('aiPlotPortalData', JSON.stringify(plots));
      
      // If online and cloud sync enabled, also sync to cloud
      if (cloudSyncEnabled && isOnline) {
        syncToCloud();
      }
    }

    function loadFromLocalStorage() {
      const savedData = localStorage.getItem('aiPlotPortalData');
      if (savedData) {
        plots = JSON.parse(savedData);
      } else {
        plots = [];
      }
    }

    // ==================== ANALYTICS ====================
    function showAnalytics() {
      document.getElementById('plotsView').classList.add('hidden');
      document.getElementById('analyticsView').classList.remove('hidden');
      updateAnalytics();
    }

    function updateAnalytics() {
      const totalPlots = plots.length;
      const totalValue = plots.reduce((sum, p) => sum + parseFloat(p.price || 0), 0);
      const available = plots.filter(p => p.status === 'Available').length;
      const avgPrice = totalPlots > 0 ? Math.round(totalValue / totalPlots) : 0;

      document.getElementById('totalPlots').textContent = totalPlots;
      document.getElementById('totalValue').textContent = `AED ${totalValue.toLocaleString()}`;
      document.getElementById('availablePlots').textContent = available;
      document.getElementById('avgPrice').textContent = `AED ${avgPrice.toLocaleString()}`;

      new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
          labels: ['Available', 'Reserved', 'Sold'],
          datasets: [{
            data: [
              plots.filter(p => p.status === 'Available').length,
              plots.filter(p => p.status === 'Reserved').length,
              plots.filter(p => p.status === 'Sold').length
            ],
            backgroundColor: ['#22c55e', '#f59e0b', '#ef4444']
          }]
        }
      });

      const devCounts = {};
      plots.forEach(p => {
        devCounts[p.dev] = (devCounts[p.dev] || 0) + 1;
      });

      new Chart(document.getElementById('devChart'), {
        type: 'bar',
        data: {
          labels: Object.keys(devCounts),
          datasets: [{
            label: 'Plots',
            data: Object.values(devCounts),
            backgroundColor: '#3b82f6'
          }]
        }
      });
    }

    // ==================== MAP ====================
    function initMap() {
      map = L.map('map').setView([25.2769, 55.2962], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      addMarkers();
    }

    function addMarkers(filteredPlots = null) {
      map.eachLayer(layer => { if (layer instanceof L.Marker) map.removeLayer(layer); });
      const plotsToShow = filteredPlots || plots;
      
      plotsToShow.forEach(plot => {
        const color = plot.status === 'Available' ? '#22c55e' : plot.status === 'Reserved' ? '#f59e0b' : '#ef4444';
        const marker = L.marker([plot.lat, plot.lng], {
          icon: L.divIcon({
            html: `<div style="background:${color};width:32px;height:32px;border-radius:50%;border:3px solid white;color:white;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.3);font-size:10px;">${plot.no}</div>`,
            iconSize: [32, 32]
          })
        }).addTo(map);
        
        marker.bindPopup(`<div style="min-width:200px;"><div style="font-weight:700;font-size:18px;margin-bottom:8px;">Plot ${plot.no}</div><div style="color:#666;margin-bottom:12px;">${plot.dev}</div></div>`);
        marker.on('click', () => selectPlot(plot.id));
      });
    }

    function selectPlot(id) {
      const plot = plots.find(p => p.id === id);
      alert(`Plot ${plot.no} - ${plot.dev}\nPrice: AED ${Number(plot.price).toLocaleString()}\nStatus: ${plot.status}`);
    }

    function showPlots() {
      document.getElementById('analyticsView').classList.add('hidden');
      document.getElementById('plotsView').classList.remove('hidden');
    }

    function renderTable(filteredPlots = null) {
      const tbody = document.getElementById('plotTableBody');
      const plotsToShow = filteredPlots || plots;
      
      tbody.innerHTML = plotsToShow.map(plot => `
        <tr class="hover:bg-gray-800">
          <td class="py-4 px-6 font-bold">${plot.no}</td>
          <td class="py-4 px-6">${plot.dev}</td>
          <td class="py-4 px-6">${plot.gfa} sqm</td>
          <td class="py-4 px-6">AED ${Number(plot.price).toLocaleString()}</td>
          <td class="py-4 px-6"><span class="px-4 py-1 rounded-full text-xs ${plot.status === 'Available' ? 'bg-green-500' : plot.status === 'Reserved' ? 'bg-orange-500' : 'bg-red-500'}">${plot.status}</span></td>
          <td class="py-4 px-6">
            <button onclick="editPlot(${plot.id})" class="text-blue-400 hover:text-blue-300 mr-3">Edit</button>
            <button onclick="deletePlot(${plot.id})" class="text-red-400 hover:text-red-300">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    // ==================== NEW PLOT ====================
    function showNewPlotModal() {
      currentEditId = null;
      document.getElementById('modalTitle').textContent = 'Add New Plot';
      document.getElementById('saveBtn').textContent = 'Add Plot';
      
      document.getElementById('plotNo').value = `D-${Date.now().toString().slice(-4)}`;
      document.getElementById('plotDev').value = 'New Development';
      document.getElementById('plotStatus').value = 'Available';
      document.getElementById('plotPrice').value = '4500000';
      document.getElementById('plotOwner').value = 'New Owner';
      document.getElementById('plotPhone').value = '+971 50 000 0000';
      document.getElementById('plotEmail').value = 'owner@email.com';
      
      document.getElementById('plotModal').classList.remove('hidden');
    }

    function editPlot(id) {
      const plot = plots.find(p => p.id === id);
      if (!plot) return;
      
      currentEditId = id;
      document.getElementById('modalTitle').textContent = 'Edit Plot';
      document.getElementById('saveBtn').textContent = 'Save Changes';
      
      document.getElementById('plotNo').value = plot.no;
      document.getElementById('plotDev').value = plot.dev;
      document.getElementById('plotStatus').value = plot.status;
      document.getElementById('plotPrice').value = plot.price;
      document.getElementById('plotOwner').value = plot.owner || '';
      document.getElementById('plotPhone').value = plot.phone || '';
      document.getElementById('plotEmail').value = plot.email || '';
      
      document.getElementById('plotModal').classList.remove('hidden');
    }

    function closePlotModal() {
      document.getElementById('plotModal').classList.add('hidden');
    }

    function savePlot() {
      const no = document.getElementById('plotNo').value.trim();
      const dev = document.getElementById('plotDev').value.trim();
      const price = document.getElementById('plotPrice').value;
      const owner = document.getElementById('plotOwner').value.trim();
      
      if (!no || !dev || !owner || !price) {
        alert('Please fill in all required fields');
        return;
      }
      
      if (currentEditId !== null) {
        const plot = plots.find(p => p.id === currentEditId);
        plot.no = no;
        plot.dev = dev;
        plot.price = price;
        plot.owner = owner;
        plot.phone = document.getElementById('plotPhone').value;
        plot.email = document.getElementById('plotEmail').value;
      } else {
        const newPlot = {
          id: plots.length,
          no: no,
          lat: 25.25 + Math.random() * 0.15,
          lng: 55.27 + Math.random() * 0.15,
          dev: dev,
          type: "Residential",
          status: document.getElementById('plotStatus').value,
          gfa: "2500",
          height: "12",
          pricePerGFA: "1800",
          pricePerSqf: "167",
          price: price,
          paymentType: "Cash",
          owner: owner,
          phone: document.getElementById('plotPhone').value,
          email: document.getElementById('plotEmail').value,
          country: "UAE",
          city: "Dubai",
          area: "Dubai Hills",
          sale: true,
          lease: false,
          jv: false,
          musataha: false
        };
        plots.push(newPlot);
      }
      
      saveToLocalStorage();
      closePlotModal();
      addMarkers();
      renderTable();
      updateAnalytics();
    }

    function deletePlot(id) {
      if (!confirm('Delete this plot?')) return;
      plots = plots.filter(p => p.id !== id);
      saveToLocalStorage();
      addMarkers();
      renderTable();
    }

    // ==================== INITIALIZE ====================
    window.onload = () => {
      loadFromLocalStorage();
      initMap();
      renderTable();
      updateConnectionStatus();
      
      // Auto-enable cloud sync if previously enabled
      const savedSync = localStorage.getItem('cloudSyncEnabled');
      if (savedSync === 'true') {
        cloudSyncEnabled = true;
        if (isOnline) {
          startCloudListener();
        }
      }
      
      // Show analytics by default
      setTimeout(() => {
        showAnalytics();
      }, 500);
      
      console.log('✅ Portal with Offline Sync loaded successfully');
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Plot Portal • Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; }
    }
    .mobile-menu { display: none; }
    @media (max-width: 768px) {
      .mobile-menu { display: block; }
      .desktop-only { display: none; }
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100">

  <!-- MOBILE HEADER -->
  <div class="md:hidden bg-gray-900 border-b border-gray-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-blue-600 rounded-2xl flex items-center justify-center">
        <i class="fas fa-map-marked text-white"></i>
      </div>
      <h1 class="text-xl font-bold">AI Plot</h1>
    </div>
    <button onclick="toggleMobileMenu()" class="text-2xl px-3">
      <i class="fas fa-bars"></i>
    </button>
  </div>

  <div class="flex h-screen overflow-hidden">
    <!-- SIDEBAR -->
    <div id="sidebar" class="w-64 bg-gray-900 border-r border-gray-800 flex-col hidden md:flex">
      <div class="p-6 border-b border-gray-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center">
            <i class="fas fa-map-marked text-white text-xl"></i>
          </div>
          <div>
            <h1 class="text-2xl font-bold">AI Plot</h1>
            <p class="text-xs text-gray-500 -mt-1">Pro Edition</p>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-4">
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-blue-600 text-white">
          <i class="fas fa-map-marker-alt"></i> Plots
        </a>
      </nav>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col">
      <!-- TOP BAR -->
      <div class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-4 md:px-8">
        <div class="flex items-center gap-4">
          <h2 class="text-xl md:text-2xl font-semibold hidden md:block">Plot Management</h2>
          
          <!-- MOBILE VIEW TOGGLE -->
          <div class="md:hidden flex bg-gray-800 rounded-2xl p-1">
            <button onclick="showMapView()" class="px-4 py-2 bg-blue-600 rounded-xl text-sm font-medium">Map</button>
            <button onclick="showTableView()" class="px-4 py-2 hover:bg-gray-700 rounded-xl text-sm font-medium">Table</button>
          </div>
        </div>

        <div class="flex gap-2 md:gap-4">
          <!-- DESKTOP VIEW TOGGLE -->
          <div class="hidden md:flex bg-gray-800 rounded-2xl p-1">
            <button onclick="showMapView()" class="px-6 py-2.5 bg-blue-600 rounded-xl text-sm font-medium flex items-center gap-2">
              <i class="fas fa-map"></i> Map
            </button>
            <button onclick="showTableView()" class="px-6 py-2.5 hover:bg-gray-700 rounded-xl text-sm font-medium flex items-center gap-2">
              <i class="fas fa-table"></i> Table
            </button>
          </div>

          <button onclick="importPlots()" class="px-4 md:px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-file-import"></i> <span class="hidden md:inline">Import</span>
          </button>
          <button onclick="exportCSV()" class="px-4 md:px-5 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-download"></i> <span class="hidden md:inline">Export</span>
          </button>
          <button onclick="showNewPlotModal()" class="px-5 md:px-6 py-2.5 bg-blue-600 hover:bg-blue-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-plus"></i> <span class="hidden md:inline">New Plot</span>
          </button>
        </div>
      </div>

      <div class="flex-1 p-4 md:p-8">
        <!-- SEARCH -->
        <div class="mb-6">
          <div class="flex flex-col md:flex-row gap-4 items-center">
            <div class="flex-1 relative w-full">
              <div class="absolute left-4 top-3.5 text-gray-400"><i class="fas fa-search"></i></div>
              <input type="text" id="globalSearch" placeholder="Search plots..." class="w-full bg-gray-800 pl-12 pr-5 py-3 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" oninput="applySearchFilters()">
              <button onclick="clearSearch()" class="absolute right-4 top-3.5 text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="flex gap-2 w-full md:w-auto">
              <button onclick="quickFilter('available')" class="flex-1 md:flex-none px-4 py-3 bg-green-600 hover:bg-green-700 rounded-2xl text-sm font-medium flex items-center justify-center gap-2"><i class="fas fa-check-circle"></i> <span class="hidden md:inline">Available</span></button>
              <button onclick="quickFilter('reserved')" class="flex-1 md:flex-none px-4 py-3 bg-orange-600 hover:bg-orange-700 rounded-2xl text-sm font-medium flex items-center justify-center gap-2"><i class="fas fa-clock"></i> <span class="hidden md:inline">Reserved</span></button>
              <button onclick="quickFilter('sold')" class="flex-1 md:flex-none px-4 py-3 bg-red-600 hover:bg-red-700 rounded-2xl text-sm font-medium flex items-center justify-center gap-2"><i class="fas fa-handshake"></i> <span class="hidden md:inline">Sold</span></button>
            </div>
          </div>
        </div>

        <!-- ADVANCED GIS TOOLS - MOBILE FRIENDLY -->
        <div class="mb-4 flex flex-wrap gap-2">
          <div class="relative">
            <button onclick="toggleGisDropdown()" class="px-5 py-3 bg-gray-900 border border-gray-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
              <i class="fas fa-tools text-blue-400"></i>
              <span>GIS Tools</span>
              <i class="fas fa-chevron-down text-xs ml-1"></i>
            </button>
            
            <div id="gisDropdown" class="hidden absolute top-14 left-0 bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl w-72 p-2 z-[1000]">
              <div class="grid grid-cols-2 gap-2">
                <button onclick="startDistanceCalculator(); toggleGisDropdown()" class="px-4 py-3 hover:bg-gray-800 rounded-xl flex items-center gap-2 text-sm"><i class="fas fa-ruler text-blue-400 w-4"></i> Distance</button>
                <button onclick="startAreaCalculator(); toggleGisDropdown()" class="px-4 py-3 hover:bg-gray-800 rounded-xl flex items-center gap-2 text-sm"><i class="fas fa-draw-polygon text-green-400 w-4"></i> Area</button>
                <button onclick="toggleDrawingMode(); toggleGisDropdown()" class="px-4 py-3 hover:bg-gray-800 rounded-xl flex items-center gap-2 text-sm"><i class="fas fa-pencil-alt text-purple-400 w-4"></i> Draw</button>
                <button onclick="createBufferZone(); toggleGisDropdown()" class="px-4 py-3 hover:bg-gray-800 rounded-xl flex items-center gap-2 text-sm"><i class="fas fa-circle text-purple-400 w-4"></i> Buffer</button>
                <button onclick="showElevationProfile(); toggleGisDropdown()" class="px-4 py-3 hover:bg-gray-800 rounded-xl flex items-center gap-2 text-sm"><i class="fas fa-mountain text-indigo-400 w-4"></i> Elevation</button>
                <button onclick="findShortestPath(); toggleGisDropdown()" class="px-4 py-3 hover:bg-gray-800 rounded-xl flex items-center gap-2 text-sm"><i class="fas fa-route text-pink-400 w-4"></i> Route</button>
                <button onclick="toggleAdvancedHeatmap(); toggleGisDropdown()" class="px-4 py-3 hover:bg-gray-800 rounded-xl flex items-center gap-2 text-sm"><i class="fas fa-fire text-red-400 w-4"></i> Heatmap</button>
                <button onclick="show3DTerrain(); toggleGisDropdown()" class="px-4 py-3 hover:bg-gray-800 rounded-xl flex items-center gap-2 text-sm"><i class="fas fa-cube text-white w-4"></i> 3D View</button>
                <button onclick="clearAllDrawings(); toggleGisDropdown()" class="px-4 py-3 hover:bg-gray-800 rounded-xl flex items-center gap-2 text-sm col-span-2"><i class="fas fa-trash text-red-400 w-4"></i> Clear All</button>
              </div>
            </div>
          </div>

          <!-- ADVANCED GIS FEATURES -->
          <button onclick="toggleMapLayers()" class="px-4 py-3 bg-gray-800 hover:bg-gray-700 rounded-2xl text-sm font-medium flex items-center gap-2">
            <i class="fas fa-layer-group"></i> <span class="hidden md:inline">Layers</span>
          </button>
          <button onclick="enableMeasurementTool()" class="px-4 py-3 bg-gray-800 hover:bg-gray-700 rounded-2xl text-sm font-medium flex items-center gap-2">
            <i class="fas fa-ruler-combined"></i> <span class="hidden md:inline">Measure</span>
          </button>
        </div>

        <!-- MAP VIEW -->
        <div id="mapView">
          <div class="bg-gray-900 rounded-3xl overflow-hidden border border-gray-800" style="height: 600px; position: relative;">
            <div id="map" style="height: 100%; width: 100%; min-height: 600px;"></div>
            
            <!-- MAP SEARCH -->
            <div class="absolute top-4 right-4 z-[1000]">
              <div class="flex bg-gray-900/95 backdrop-blur-xl border border-gray-700 rounded-2xl overflow-hidden">
                <input type="text" id="mapSearch" placeholder="Search location..." class="px-4 py-2 text-sm w-48 focus:outline-none" onkeypress="if (event.key === 'Enter') searchOnMap()">
                <button onclick="searchOnMap()" class="px-4 bg-blue-600 hover:bg-blue-700"><i class="fas fa-search"></i></button>
              </div>
            </div>
          </div>
        </div>

        <!-- TABLE VIEW -->
        <div id="tableView" class="hidden">
          <div class="bg-gray-900 rounded-3xl border border-gray-800 overflow-hidden">
            <table class="w-full text-sm">
              <thead class="border-b border-gray-700 bg-gray-950">
                <tr>
                  <th class="text-left py-4 px-6">Plot No</th>
                  <th class="text-left py-4 px-6">Development</th>
                  <th class="text-left py-4 px-6">Size</th>
                  <th class="text-left py-4 px-6">Price</th>
                  <th class="text-left py-4 px-6">Status</th>
                  <th class="text-left py-4 px-6">Actions</th>
                </tr>
              </thead>
              <tbody id="plotTableBody" class="divide-y divide-gray-800"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE CARD -->
    <div id="mapCard" class="w-96 bg-gray-900 border-l border-gray-800 p-6 overflow-auto hidden">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold">Plot Details</h3>
        <button onclick="closeCard()" class="text-3xl text-gray-400 hover:text-white">×</button>
      </div>
      <div id="plotDetailsContent"></div>
    </div>
  </div>

  <!-- PRINT AREA (Hidden) -->
  <div id="printArea" class="hidden p-8 max-w-[800px] mx-auto bg-white text-black">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-blue-900">AI Plot Portal</h1>
      <p class="text-gray-600">Professional Real Estate Report</p>
    </div>
    <div id="printContent"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    let map;
    let plots = [];
    let currentEditId = null;
    let currentSearchTerm = '';
    let drawingMode = false;
    let currentDrawing = null;
    let drawingPoints = [];
    let currentLayer = null;

    // ==================== MOBILE MENU ====================
    function toggleMobileMenu() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
      sidebar.classList.toggle('flex');
    }

    // ==================== MAP ====================
    function initMap() {
      map = L.map('map').setView([25.2769, 55.2962], 11);
      
      // Default layer
      currentLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);
      
      addMarkers();
      setTimeout(() => { if (map) map.invalidateSize(); }, 200);
    }

    function addMarkers(filteredPlots = null) {
      map.eachLayer(layer => { if (layer instanceof L.Marker) map.removeLayer(layer); });
      const plotsToShow = filteredPlots || plots;
      plotsToShow.forEach(plot => {
        const color = plot.status === 'Available' ? '#22c55e' : plot.status === 'Reserved' ? '#f59e0b' : '#ef4444';
        const marker = L.marker([plot.lat, plot.lng], {
          icon: L.divIcon({
            html: `<div style="background:${color};width:32px;height:32px;border-radius:50%;border:3px solid white;color:white;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.3);font-size:10px;">${plot.no}</div>`,
            iconSize: [32, 32]
          })
        }).addTo(map);
        marker.bindPopup(`<div style="min-width:200px;"><div style="font-weight:700;font-size:18px;margin-bottom:8px;">Plot ${plot.no}</div><div style="color:#666;margin-bottom:12px;">${plot.dev}</div><div style="background:${color};color:white;padding:4px 12px;border-radius:20px;display:inline-block;">${plot.status}</div></div>`);
        marker.on('click', () => selectPlot(plot.id));
      });
    }

    function selectPlot(id) {
      const plot = plots.find(p => p.id === id);
      const card = document.getElementById('mapCard');
      const content = document.getElementById('plotDetailsContent');
      card.classList.remove('hidden');
      
      content.innerHTML = `
        <div class="mb-6">
          <div class="flex items-center justify-between mb-4">
            <div><div class="text-4xl font-bold">Plot ${plot.no}</div><div class="text-blue-400 text-lg">${plot.dev}</div></div>
            <div class="px-6 py-2 rounded-2xl text-sm font-bold ${plot.status === 'Available' ? 'bg-green-600' : plot.status === 'Reserved' ? 'bg-orange-600' : 'bg-red-600'}">${plot.status}</div>
          </div>
        </div>

        <div class="space-y-4">
          <div class="bg-gray-800 rounded-2xl p-4"><div class="text-xs text-gray-400 mb-3">LOCATION</div><div class="font-bold">${plot.country || 'UAE'} - ${plot.city || 'Dubai'} - ${plot.area || 'N/A'}</div></div>
          
          <div class="bg-gray-800 rounded-2xl p-4"><div class="text-xs text-gray-400 mb-3">DIMENSIONS</div><div class="grid grid-cols-2 gap-4 text-sm"><div><div class="text-gray-400">GFA</div><div class="font-bold">${plot.gfa || 'N/A'} sqm</div></div><div><div class="text-gray-400">Height</div><div class="font-bold">${plot.height || 'N/A'} m</div></div><div><div class="text-gray-400">Price/GFA</div><div class="font-bold">AED ${plot.pricePerGFA || 'N/A'}</div></div><div><div class="text-gray-400">Payment</div><div class="font-bold">${plot.paymentType || 'N/A'}</div></div></div></div>

          <div class="bg-gray-800 rounded-2xl p-4"><div class="text-xs text-gray-400 mb-3">TRANSACTION TYPES</div><div class="flex flex-wrap gap-2">${plot.sale ? '<span class="px-3 py-1 bg-green-600 rounded-full text-xs">Sale</span>' : ''}${plot.lease ? '<span class="px-3 py-1 bg-blue-600 rounded-full text-xs">Lease</span>' : ''}${plot.jv ? '<span class="px-3 py-1 bg-purple-600 rounded-full text-xs">JV</span>' : ''}${plot.musataha ? '<span class="px-3 py-1 bg-orange-600 rounded-full text-xs">Musataha</span>' : ''}</div></div>

          <div class="bg-gray-800 rounded-2xl p-4"><div class="text-xs text-gray-400 mb-3">PRICING</div><div class="text-3xl font-bold text-green-400">AED ${Number(plot.price).toLocaleString()}</div></div>
        </div>

        <div class="mt-6">
          <div class="text-xs text-gray-400 mb-3">SHARE & CONTACT</div>
          <div class="grid grid-cols-3 gap-3">
            <button onclick="sendToWhatsApp(${plot.id})" class="py-3 bg-green-600 hover:bg-green-700 rounded-2xl text-sm font-medium flex items-center justify-center gap-2"><i class="fab fa-whatsapp"></i> WhatsApp</button>
            <button onclick="sendEmail(${plot.id})" class="py-3 bg-blue-600 hover:bg-blue-700 rounded-2xl text-sm font-medium flex items-center justify-center gap-2"><i class="fas fa-envelope"></i> Email</button>
            <button onclick="startVideoCall(${plot.id})" class="py-3 bg-purple-600 hover:bg-purple-700 rounded-2xl text-sm font-medium flex items-center justify-center gap-2"><i class="fas fa-video"></i> Video Call</button>
          </div>
        </div>

        <div class="mt-6 flex gap-3">
          <button onclick="printPlot(${plot.id})" class="flex-1 py-4 bg-gray-700 hover:bg-gray-600 rounded-2xl text-sm font-medium flex items-center justify-center gap-2"><i class="fas fa-print"></i> Print</button>
          <button onclick="editPlot(${plot.id}); closeCard()" class="flex-1 py-4 bg-blue-600 hover:bg-blue-700 rounded-2xl text-sm font-medium">Edit</button>
          <button onclick="deletePlot(${plot.id}); closeCard()" class="flex-1 py-4 border border-red-600 text-red-400 hover:bg-red-900/50 rounded-2xl text-sm font-medium">Delete</button>
        </div>
      `;
    }

    function closeCard() { document.getElementById('mapCard').classList.add('hidden'); }

    function showMapView() {
      document.getElementById('mapView').classList.remove('hidden');
      document.getElementById('tableView').classList.add('hidden');
      setTimeout(() => { if (map) map.invalidateSize(); }, 100);
    }

    function showTableView() {
      document.getElementById('mapView').classList.add('hidden');
      document.getElementById('tableView').classList.remove('hidden');
      renderTable();
    }

    function renderTable(filteredPlots = null) {
      const tbody = document.getElementById('plotTableBody');
      const plotsToShow = filteredPlots || plots;
      tbody.innerHTML = plotsToShow.map(plot => `
        <tr class="hover:bg-gray-800">
          <td class="py-4 px-6 font-bold">${highlightMatch(plot.no, currentSearchTerm)}</td>
          <td class="py-4 px-6">${highlightMatch(plot.dev, currentSearchTerm)}</td>
          <td class="py-4 px-6">${plot.gfa || plot.size} sqm</td>
          <td class="py-4 px-6">AED ${Number(plot.price).toLocaleString()}</td>
          <td class="py-4 px-6"><span class="px-4 py-1 rounded-full text-xs ${plot.status === 'Available' ? 'bg-green-500' : plot.status === 'Reserved' ? 'bg-orange-500' : 'bg-red-500'}">${plot.status}</span></td>
          <td class="py-4 px-6">
            <button onclick="selectPlot(${plot.id}); showMapView()" class="text-blue-400 hover:text-blue-300 mr-3">View</button>
            <button onclick="deletePlot(${plot.id})" class="text-red-400 hover:text-red-300">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function highlightMatch(text, searchTerm) {
      if (!searchTerm || !text) return text;
      const regex = new RegExp(`(${searchTerm})`, 'gi');
      return text.toString().replace(regex, '<mark class="bg-yellow-400 text-black px-1 rounded">$1</mark>');
    }

    // ==================== OPTIMIZED PRINT FUNCTION ====================
    function printPlot(id) {
      const plot = plots.find(p => p.id === id);
      if (!plot) return;

      const printContent = document.getElementById('printContent');
      printContent.innerHTML = `
        <div style="font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px;">
          <div style="text-align: center; margin-bottom: 30px; border-bottom: 3px solid #1e40af; padding-bottom: 20px;">
            <h1 style="color: #1e40af; font-size: 32px; margin: 0;">AI Plot Portal</h1>
            <p style="color: #666; margin: 8px 0 0 0;">Professional Real Estate Report • ${new Date().toLocaleDateString()}</p>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            <div>
              <h2 style="color: #1e40af; font-size: 24px; margin-bottom: 15px;">Plot ${plot.no}</h2>
              <p style="font-size: 18px; margin-bottom: 20px;"><strong>${plot.dev}</strong></p>
              
              <div style="margin-bottom: 15px;">
                <strong style="color: #333;">Status:</strong> 
                <span style="background: ${plot.status === 'Available' ? '#22c55e' : plot.status === 'Reserved' ? '#f59e0b' : '#ef4444'}; color: white; padding: 4px 12px; border-radius: 20px; font-size: 14px;">${plot.status}</span>
              </div>

              <div style="margin-bottom: 15px;"><strong style="color: #333;">Location:</strong> ${plot.country || 'UAE'} - ${plot.city || 'Dubai'} - ${plot.area || 'N/A'}</div>
              <div style="margin-bottom: 15px;"><strong style="color: #333;">GFA:</strong> ${plot.gfa} sqm | <strong>Height:</strong> ${plot.height || 'N/A'} m</div>
              <div style="margin-bottom: 15px;"><strong style="color: #333;">Price per GFA:</strong> AED ${plot.pricePerGFA || 'N/A'}</div>
            </div>

            <div>
              <div style="background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                <div style="font-size: 28px; font-weight: bold; color: #166534;">AED ${Number(plot.price).toLocaleString()}</div>
                <div style="color: #666; font-size: 14px;">Total Price</div>
              </div>

              <div style="margin-bottom: 15px;"><strong style="color: #333;">Payment Type:</strong> ${plot.paymentType || 'Cash'}</div>
              <div style="margin-bottom: 15px;"><strong style="color: #333;">Transaction Types:</strong> ${plot.sale ? 'Sale ' : ''}${plot.lease ? 'Lease ' : ''}${plot.jv ? 'JV ' : ''}${plot.musataha ? 'Musataha' : ''}</div>
            </div>
          </div>

          <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666; text-align: center;">
            Generated by AI Plot Portal • Confidential Document
          </div>
        </div>
      `;

      const printArea = document.getElementById('printArea');
      printArea.classList.remove('hidden');
      
      setTimeout(() => {
        window.print();
        printArea.classList.add('hidden');
      }, 300);
    }

    // ==================== ADVANCED GIS FEATURES ====================
    
    function toggleMapLayers() {
      const layers = [
        { name: 'Streets', url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png' },
        { name: 'Satellite', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}' },
        { name: 'Terrain', url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png' },
        { name: 'Dark', url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' }
      ];

      const currentLayerName = currentLayer.options.attribution || 'Streets';
      
      let html = '<div class="p-4 bg-gray-900 border border-gray-700 rounded-2xl w-64"><div class="font-bold mb-3">Map Layers</div>';
      
      layers.forEach(layer => {
        const active = currentLayerName.includes(layer.name) ? 'bg-blue-600' : 'hover:bg-gray-700';
        html += `<button onclick="switchMapLayer('${layer.url}', '${layer.name}'); this.parentElement.remove();" class="w-full text-left px-4 py-3 rounded-xl mb-1 flex items-center gap-3 ${active}">
          <i class="fas fa-layer-group text-blue-400"></i> ${layer.name}
        </button>`;
      });
      
      html += '</div>';
      
      const popup = document.createElement('div');
      popup.innerHTML = html;
      popup.style.position = 'fixed';
      popup.style.top = '50%';
      popup.style.left = '50%';
      popup.style.transform = 'translate(-50%, -50%)';
      popup.style.zIndex = '9999';
      document.body.appendChild(popup);
      
      setTimeout(() => {
        document.addEventListener('click', function handler(e) {
          if (!popup.contains(e.target)) {
            popup.remove();
            document.removeEventListener('click', handler);
          }
        });
      }, 100);
    }

    function switchMapLayer(url, name) {
      if (currentLayer) map.removeLayer(currentLayer);
      currentLayer = L.tileLayer(url, { attribution: name }).addTo(map);
    }

    function enableMeasurementTool() {
      alert('📏 Measurement Tool Activated!\n\nClick on the map to start measuring.\nDouble-click to finish.');
      // Simple implementation - can be expanded
    }

    function searchOnMap() {
      const query = document.getElementById('mapSearch').value.trim();
      if (!query) return;

      // Simple geocoding simulation
      const locations = {
        'dubai': [25.2769, 55.2962],
        'abu dhabi': [24.4539, 54.3773],
        'sharjah': [25.3463, 55.4209],
        'ajman': [25.4052, 55.5136]
      };

      const key = query.toLowerCase();
      if (locations[key]) {
        map.flyTo(locations[key], 13);
        alert(`📍 Navigating to ${query}`);
      } else {
        alert('Location not found. Try: Dubai, Abu Dhabi, Sharjah, or Ajman');
      }
    }

    function toggleGisDropdown() {
      const dropdown = document.getElementById('gisDropdown');
      dropdown.classList.toggle('hidden');

    function sendToWhatsApp(id) {
      const plot = plots.find(p => p.id === id);
      if (!plot) return;
      const message = `Hello! I'm interested in Plot ${plot.no} in ${plot.dev}.\n\nPrice: AED ${Number(plot.price).toLocaleString()}\nStatus: ${plot.status}\n\nCan we discuss?`;
      const phone = plot.phone ? plot.phone.replace(/[^0-9]/g, '') : '971501234567';
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    }

    function sendEmail(id) {
      const plot = plots.find(p => p.id === id);
      if (!plot) return;
      const subject = `Inquiry about Plot ${plot.no} - ${plot.dev}`;
      const body = `Hello,\n\nI am interested in Plot ${plot.no} in ${plot.dev}.\n\nPrice: AED ${Number(plot.price).toLocaleString()}\nStatus: ${plot.status}\n\nBest regards`;
      const email = plot.email || 'owner@email.com';
      window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    function startVideoCall(id) {
      const plot = plots.find(p => p.id === id);
      if (!plot) return;
      const roomName = `plot-${plot.no.toLowerCase()}-${Date.now()}`;
      const jitsiUrl = `https://meet.jit.si/${roomName}`;
      window.open(jitsiUrl, '_blank', 'width=1200,height=800');
      alert(`✅ Video call started for Plot ${plot.no}\n\nShare this link: ${jitsiUrl}`);
    }

    function applySearchFilters() {
      const searchTerm = document.getElementById('globalSearch').value.toLowerCase().trim();
      currentSearchTerm = searchTerm;
      const minPrice = parseFloat(document.getElementById('minPrice')?.value) || 0;
      const maxPrice = parseFloat(document.getElementById('maxPrice')?.value) || Infinity;
      const minSize = parseFloat(document.getElementById('minSize')?.value) || 0;
      const maxSize = parseFloat(document.getElementById('maxSize')?.value) || Infinity;
      const typeFilter = document.getElementById('typeFilter')?.value || '';
      const statusFilter = document.getElementById('statusFilter')?.value || '';
      
      let filtered = plots.filter(plot => {
        let matchesSearch = true;
        if (searchTerm) {
          matchesSearch = plot.no.toLowerCase().includes(searchTerm) || plot.dev.toLowerCase().includes(searchTerm) || (plot.owner && plot.owner.toLowerCase().includes(searchTerm)) || (plot.type && plot.type.toLowerCase().includes(searchTerm)) || plot.status.toLowerCase().includes(searchTerm) || plot.price.toString().includes(searchTerm);
        }
        const priceMatch = plot.price >= minPrice && plot.price <= maxPrice;
        const size = parseFloat(plot.gfa) || 0;
        const sizeMatch = size >= minSize && size <= maxSize;
        const typeMatch = !typeFilter || plot.type === typeFilter;
        const statusMatch = !statusFilter || plot.status === statusFilter;
        return matchesSearch && priceMatch && sizeMatch && typeMatch && statusMatch;
      });
      
      addMarkers(filtered);
      renderTable(filtered);
    }

    function clearSearch() {
      document.getElementById('globalSearch').value = '';
      currentSearchTerm = '';
      applySearchFilters();
    }

    function quickFilter(type) {
      document.getElementById('globalSearch').value = '';
      document.getElementById('minPrice').value = '';
      document.getElementById('maxPrice').value = '';
      document.getElementById('minSize').value = '';
      document.getElementById('maxSize').value = '';
      document.getElementById('typeFilter').value = '';
      if (type === 'available') document.getElementById('statusFilter').value = 'Available';
      else if (type === 'reserved') document.getElementById('statusFilter').value = 'Reserved';
      else if (type === 'sold') document.getElementById('statusFilter').value = 'Sold';
      applySearchFilters();
    }

    // ==================== INITIALIZE ====================
    window.onload = () => {
      initMap();
      renderTable();
      console.log('✅ Portal Optimized for Mobile + Advanced GIS loaded successfully');
    };
  </script>

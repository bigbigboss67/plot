<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Plot Portal • Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-950 text-gray-100">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col">
      <div class="p-6 border-b border-gray-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center">
            <i class="fas fa-map-marked text-white text-xl"></i>
          </div>
          <div>
            <h1 class="text-2xl font-bold">AI Plot</h1>
            <p class="text-xs text-gray-500 -mt-1">Pro Edition</p>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-4">
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-blue-600 text-white">
          <i class="fas fa-map-marker-alt"></i> Plots
        </a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
      <div class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-8">
        <h2 class="text-2xl font-semibold">Plot Management</h2>
        <div class="flex gap-4">
          <button onclick="addNewPlot()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-plus"></i> New Plot
          </button>
          <button onclick="exportCSV()" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-2xl flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-download"></i> Export
          </button>
        </div>
      </div>

      <div class="flex-1 p-8">
        <div class="flex justify-between items-center mb-6">
          <div class="flex gap-3">
            <button onclick="showMapView()" class="px-6 py-2.5 bg-blue-600 rounded-2xl text-sm font-medium">Map View</button>
            <button onclick="showTableView()" class="px-6 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-2xl text-sm font-medium">Table View</button>
          </div>
          <div class="flex items-center gap-4">
            <select id="statusFilter" onchange="filterPlots()" class="bg-gray-800 px-5 py-3 rounded-2xl text-sm">
              <option value="">All Status</option>
              <option value="Available">Available</option>
              <option value="Reserved">Reserved</option>
              <option value="Sold">Sold</option>
            </select>
            <button onclick="clearFilters()" class="px-5 py-3 bg-gray-800 hover:bg-gray-700 rounded-2xl text-sm">Clear</button>
          </div>
        </div>

        <!-- MAP VIEW -->
        <div id="mapView">
          <div class="bg-gray-900 rounded-3xl overflow-hidden border border-gray-800" style="height: 600px;">
            <div id="map" style="height: 100%; width: 100%;"></div>
          </div>
        </div>

        <!-- TABLE VIEW -->
        <div id="tableView" class="hidden">
          <div class="bg-gray-900 rounded-3xl border border-gray-800 overflow-hidden">
            <table class="w-full text-sm">
              <thead class="border-b border-gray-700 bg-gray-950">
                <tr>
                  <th class="text-left py-4 px-6">Plot No</th>
                  <th class="text-left py-4 px-6">Development</th>
                  <th class="text-left py-4 px-6">Size</th>
                  <th class="text-left py-4 px-6">Price</th>
                  <th class="text-left py-4 px-6">Status</th>
                  <th class="text-left py-4 px-6">Actions</th>
                </tr>
              </thead>
              <tbody id="plotTableBody" class="divide-y divide-gray-800"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let map;
    let plots = [
      { id: 0, no: "A-128", lat: 25.2769, lng: 55.2962, dev: "Dubai Hills Estate", size: "1250", price: "4375000", status: "Available" },
      { id: 1, no: "B-305", lat: 25.2482, lng: 55.3123, dev: "Emirates Hills", size: "980", price: "6200000", status: "Reserved" },
      { id: 2, no: "C-042", lat: 25.2891, lng: 55.3784, dev: "Arabian Ranches", size: "2100", price: "8900000", status: "Sold" }
    ];

    // Initialize Map
    function initMap() {
      map = L.map('map').setView([25.2769, 55.2962], 11);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);
      
      addMarkers();
    }

    function addMarkers() {
      plots.forEach(plot => {
        const color = plot.status === 'Available' ? '#22c55e' : plot.status === 'Reserved' ? '#f59e0b' : '#ef4444';
        
        const marker = L.marker([plot.lat, plot.lng], {
          icon: L.divIcon({
            html: `<div style="background:${color};width:32px;height:32px;border-radius:50%;border:3px solid white;color:white;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.3);font-size:10px;">${plot.no}</div>`,
            iconSize: [32, 32]
          })
        }).addTo(map);
        
        marker.bindPopup(`
          <div style="min-width:200px;">
            <div style="font-weight:700;font-size:18px;margin-bottom:8px;">Plot ${plot.no}</div>
            <div style="color:#666;margin-bottom:12px;">${plot.dev}</div>
            <div style="margin-bottom:6px;"><strong>Size:</strong> ${plot.size} sqm</div>
            <div style="margin-bottom:12px;"><strong>Price:</strong> AED ${Number(plot.price).toLocaleString()}</div>
            <div style="background:${color};color:white;padding:4px 12px;border-radius:20px;display:inline-block;">${plot.status}</div>
          </div>
        `);
        
        marker.on('click', () => showPlotDetails(plot.id));
      });
    }

    function showPlotDetails(id) {
      const plot = plots.find(p => p.id === id);
      alert(`Plot ${plot.no}\n${plot.dev}\nSize: ${plot.size} sqm\nPrice: AED ${Number(plot.price).toLocaleString()}\nStatus: ${plot.status}`);
    }

    function showMapView() {
      document.getElementById('mapView').classList.remove('hidden');
      document.getElementById('tableView').classList.add('hidden');
    }

    function showTableView() {
      document.getElementById('mapView').classList.add('hidden');
      document.getElementById('tableView').classList.remove('hidden');
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('plotTableBody');
      tbody.innerHTML = plots.map(plot => `
        <tr class="hover:bg-gray-800">
          <td class="py-4 px-6 font-bold">${plot.no}</td>
          <td class="py-4 px-6">${plot.dev}</td>
          <td class="py-4 px-6">${plot.size} sqm</td>
          <td class="py-4 px-6">AED ${Number(plot.price).toLocaleString()}</td>
          <td class="py-4 px-6">
            <span class="px-4 py-1 rounded-full text-xs ${plot.status === 'Available' ? 'bg-green-500' : plot.status === 'Reserved' ? 'bg-orange-500' : 'bg-red-500'}">${plot.status}</span>
          </td>
          <td class="py-4 px-6">
            <button onclick="showPlotDetails(${plot.id})" class="text-blue-400 hover:text-blue-300 mr-3">View</button>
            <button onclick="deletePlot(${plot.id})" class="text-red-400 hover:text-red-300">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function filterPlots() {
      const status = document.getElementById('statusFilter').value;
      const filtered = status ? plots.filter(p => p.status === status) : plots;
      
      // Clear and re-add markers
      map.eachLayer(layer => {
        if (layer instanceof L.Marker) map.removeLayer(layer);
      });
      
      filtered.forEach(plot => {
        const color = plot.status === 'Available' ? '#22c55e' : plot.status === 'Reserved' ? '#f59e0b' : '#ef4444';
        const marker = L.marker([plot.lat, plot.lng], {
          icon: L.divIcon({
            html: `<div style="background:${color};width:32px;height:32px;border-radius:50%;border:3px solid white;color:white;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:10px;">${plot.no}</div>`,
            iconSize: [32, 32]
          })
        }).addTo(map);
        
        marker.bindPopup(`Plot ${plot.no} - ${plot.dev}`);
      });
    }

    function clearFilters() {
      document.getElementById('statusFilter').value = '';
      map.eachLayer(layer => {
        if (layer instanceof L.Marker) map.removeLayer(layer);
      });
      addMarkers();
    }

    function addNewPlot() {
      const no = prompt('Plot Number:', `D-${Date.now().toString().slice(-4)}`);
      if (!no) return;
      
      const dev = prompt('Development:', 'New Development');
      const size = prompt('Size (sqm):', '1000');
      const price = prompt('Price (AED):', '3500000');
      
      const newPlot = {
        id: plots.length,
        no: no,
        lat: 25.25 + Math.random() * 0.15,
        lng: 55.27 + Math.random() * 0.15,
        dev: dev || 'New Development',
        size: size || '1000',
        price: price || '3500000',
        status: 'Available'
      };
      
      plots.push(newPlot);
      addMarkers();
      renderTable();
      alert(`✅ Plot ${no} added successfully!`);
    }

    function deletePlot(id) {
      if (!confirm('Delete this plot?')) return;
      plots = plots.filter(p => p.id !== id);
      map.eachLayer(layer => {
        if (layer instanceof L.Marker) map.removeLayer(layer);
      });
      addMarkers();
      renderTable();
    }

    function exportCSV() {
      let csv = "Plot No,Development,Size,Price,Status\n";
      plots.forEach(p => csv += `${p.no},${p.dev},${p.size},${p.price},${p.status}\n`);
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'plots_export.csv';
      a.click();
    }

    // Initialize everything
    window.onload = () => {
      initMap();
      renderTable();
      console.log('✅ Portal loaded successfully');
    };
  </script>
</body>
</html>
